[workspace]
resolver = "2"
members = ["crates/vhalla-core", "crates/vhalla-wire", "crates/vhalla-crypto", "crates/vhalla-policy", "crates/vhalla-host", "crates/vhalla-steel-thread", "crates/vhalla-transport", "crates/vhalla-ledger", "crates/vhalla-session", "crates/vhalla-identity", "crates/vhalla-native", "crates/vhalla-cli", "crates/vhalla-social", "crates/vhalla-social-store", "crates/vhalla-discovery", "crates/vhalla-attention", "crates/vhalla-discovery-store", "crates/vhalla-retrieval"]
exclude = ["prototypes/*"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
