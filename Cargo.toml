[workspace]
resolver = "2"
members = ["crates/vhalla-core", "crates/vhalla-wire", "crates/vhalla-crypto", "crates/vhalla-policy", "crates/vhalla-host", "crates/vhalla-steel-thread", "crates/vhalla-transport", "crates/vhalla-ledger", "crates/vhalla-session", "crates/vhalla-identity", "crates/vhalla-custody", "crates/vhalla-journal", "crates/vhalla-native", "crates/vhalla-cli", "crates/vhalla-social", "crates/vhalla-social-store", "crates/vhalla-discovery", "crates/vhalla-attention", "crates/vhalla-discovery-store", "crates/vhalla-retrieval", "crates/vhalla-rooms", "crates/vhalla-rooms-store", "crates/vhalla-rooms-consensus", "crates/vhalla-rooms-node", "crates/vhalla-rooms-app", "crates/vhalla-rooms-tui", "crates/vhalla-witness", "crates/vhalla-botcaptcha", "crates/vhalla-game-platonik", "crates/vhalla-public-protocol", "crates/vhalla-private-protocol", "crates/vhalla-private-kernel", "crates/vhalla-private-native", "crates/vhalla-private-relay", "crates/vhalla-browser-vault", "crates/vhalla-browser-storage", "crates/vhalla-public-client", "crates/vhalla-room-activity", "crates/vhalla-room-activity-store", "crates/vhalla-public-peer", "browser"]
exclude = ["prototypes/*", "vendor/libp2p-dns"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"

# Preserve Malachite/libp2p 0.56 while removing its vulnerable Hickory 0.25 stack.
# Scope, upstream provenance, and removal criteria: vendor/libp2p-dns/README.md.
[patch.crates-io]
libp2p-dns = { path = "vendor/libp2p-dns" }
