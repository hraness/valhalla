[package]
name = "vhalla-menubar"
version = "0.1.0"
description = "Valhalla menu-bar companion for agent outputs"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
desktop-foundation = { git = "https://github.com/hraness/desktop-foundation", tag = "v0.3.0" }
libc = "0.2"
serde_json = "1.0"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
