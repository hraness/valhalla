[package]
name = "valhalla-private-rooms-mls-qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

# Deliberately isolated from Valhalla's shipping workspace and lockfile.
[workspace]

[dependencies]
openmls = { version = "=0.9.0", default-features = false }
openmls_traits = { version = "=0.6.0", default-features = false }
openmls_rust_crypto = { version = "=0.6.0", default-features = false }
openmls_basic_credential = { version = "=0.6.0", default-features = false }
openmls_memory_storage = { version = "=0.6.0", default-features = false }
tls_codec = { version = "0.5", features = ["derive", "serde", "mls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = "=0.10.1"
sha2 = "0.10"
zeroize = "1"
getrandom = "=0.2.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "=0.9.0", default-features = false, features = ["js"] }
# Matches upstream's explicit entropy feature edge for RustCrypto and credentials.
getrandom = { version = "=0.2.17", features = ["js"] }
# Qualify the exact bindings already pinned by the maintained browser.
wasm-bindgen = "=0.2.108"
js-sys = "=0.3.85"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[profile.dev]
debug = 0
strip = "none"

[profile.test]
debug = 0
strip = "none"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
