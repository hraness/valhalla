[package]
name = "game-wasm-parity"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "Stage 4 of the Platonik session adapter plan: rebuilds the frozen game session vectors from their hex, replays every record through Receiver<PlatonikV1> natively and under wasm32-unknown-unknown, and compares every checkpoint hash and receipt with the committed values"

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[dependencies]
# Default features only: the receiver path this prototype exercises is the one
# a receiver without `oracle` runs, so `platonik-core`, serde, and serde_json
# are absent from this graph.
vhalla-game-platonik = { path = "../../crates/vhalla-game-platonik" }
vhalla-witness = { path = "../../crates/vhalla-witness" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.108"
