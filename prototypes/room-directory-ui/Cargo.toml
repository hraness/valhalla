[package]
name = "vhalla-room-directory-ui"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]
resolver = "2"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
debug = false
strip = "debuginfo"

[features]
default = []
web = ["dioxus/web", "dioxus/launch"]
desktop = ["dioxus/desktop", "dioxus/launch"]
devtools = ["dioxus/devtools"]

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["lib", "router"] }
vhalla-rooms-app = { path = "../../crates/vhalla-rooms-app" }
vhalla-rooms = { path = "../../crates/vhalla-rooms" }
vhalla-social = { path = "../../crates/vhalla-social" }

[dev-dependencies]
dioxus-ssr = "=0.7.10"

[[bin]]
name = "vhalla-rooms-web"
path = "src/bin/web.rs"
required-features = ["web"]

[[bin]]
name = "vhalla-rooms-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
