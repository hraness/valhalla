[package]
name = "valhalla-clankdar-attest-prototype"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "clankdar-attest"
path = "src/main.rs"

[dependencies]
vhalla-room-activity = { path = "../../crates/vhalla-room-activity" }
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing", "formatting"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[workspace]
