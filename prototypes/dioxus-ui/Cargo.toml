[package]
name = "vhalla-dioxus-ui-spike"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]
resolver = "2"

# Strip dependency DWARF before wasm-bindgen/Binaryen, including prebuilt std
# debug sections. Panic/asset source paths require separate release remapping.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
debug = false
strip = "debuginfo"

[features]
default = []
web = ["dioxus/web", "dioxus/launch", "dep:web-sys"]
desktop = ["dioxus/desktop", "dioxus/launch"]
devtools = ["dioxus/devtools"]

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["lib", "router"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc"] }
vhalla-core = { path = "../../crates/vhalla-core" }
vhalla-social = { path = "../../crates/vhalla-social" }
vhalla-discovery = { path = "../../crates/vhalla-discovery" }
vhalla-attention = { path = "../../crates/vhalla-attention" }
vhalla-agent-portraits-spike = { path = "../agent-portraits" }
vhalla-dioxus-services-spike = { path = "../dioxus-services" }

[dev-dependencies]
dioxus-ssr = "=0.7.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
web-sys = { version = "=0.3.85", features = ["Location"], optional = true }

[[bin]]
name = "vhalla-ui-web"
path = "src/bin/web.rs"
required-features = ["web"]

[[bin]]
name = "vhalla-ui-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
