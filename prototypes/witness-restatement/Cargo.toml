[package]
name = "witness-restatement"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "Spike 1 (platonik-parity): the Platonik habitat-v1 execution model restated in Valhalla-style no_std types, checked bit for bit against the pinned engine"

[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[features]
# The corpus module: the pinned Platonik engine as converter source and test
# oracle. The no_std core never enables it.
std = ["dep:platonik-core", "dep:serde_json"]

[dependencies]
sha2 = { version = "0.10", default-features = false }
platonik-core = { git = "https://github.com/hraness/platonik", rev = "5eedec07c84af3b4beb82f22cc6c2b9fa3520d42", optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
witness-restatement = { path = ".", features = ["std"] }
platonik-core = { git = "https://github.com/hraness/platonik", rev = "5eedec07c84af3b4beb82f22cc6c2b9fa3520d42" }
serde_json = "1.0"
