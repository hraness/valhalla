[package]
name = "vhalla-dioxus-controller-spike"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[dependencies]
vhalla-dioxus-services-spike = { path = "../dioxus-services" }

[dev-dependencies]
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc"] }
proptest = "1.6"
vhalla-core = { path = "../../crates/vhalla-core" }
vhalla-social = { path = "../../crates/vhalla-social" }
vhalla-discovery = { path = "../../crates/vhalla-discovery" }
vhalla-attention = { path = "../../crates/vhalla-attention" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
