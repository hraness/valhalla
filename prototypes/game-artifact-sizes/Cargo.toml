[package]
name = "game-artifact-sizes"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "Spike 2 of the Platonik session adapter plan: do 64 KiB blocks, 128 blocks, and per-(segment, case) granularity fit real Platonik and adapter sizes, and do the widest GameManifest and SessionOpen fit one signed frame?"

[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[dependencies]
platonik-core = { git = "https://github.com/hraness/platonik", rev = "5eedec07c84af3b4beb82f22cc6c2b9fa3520d42" }
serde_json = "1.0"
sha2 = { version = "0.10", default-features = false }
vhalla-core = { path = "../../crates/vhalla-core" }
vhalla-crypto = { path = "../../crates/vhalla-crypto" }
vhalla-game-platonik = { path = "../../crates/vhalla-game-platonik", features = ["oracle"] }
vhalla-witness = { path = "../../crates/vhalla-witness" }
