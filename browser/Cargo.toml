[package]
name = "vhalla-browser"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rust/WASM browser participation and local encrypted identity."

[features]
default = []
# Local browser acceptance harness only; never use this build for deployment.
local-qualification = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde = "1"
serde_json = "1"
futures-channel = "0.3"
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
js-sys = "=0.3.85"
web-sys = { version = "=0.3.85", features = ["Window", "Performance", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "HtmlButtonElement", "HtmlAnchorElement", "HtmlFormElement", "Event", "EventTarget", "MessageEvent", "ErrorEvent", "Worker", "WorkerGlobalScope", "DedicatedWorkerGlobalScope", "Crypto", "Blob", "BlobPropertyBag", "File", "FileList", "Url", "Location", "AbortController", "AbortSignal", "RequestInit", "RequestCache", "RequestCredentials", "RequestMode", "RequestRedirect", "ReferrerPolicy", "Response", "Headers", "ReadableStream", "ReadableStreamDefaultReader"] }
zeroize = { version = "1.9", features = ["alloc"] }
vhalla-browser-vault = { path = "../crates/vhalla-browser-vault" }
vhalla-browser-storage = { path = "../crates/vhalla-browser-storage" }
vhalla-public-protocol = { path = "../crates/vhalla-public-protocol" }
vhalla-public-client = { path = "../crates/vhalla-public-client" }
vhalla-room-activity = { path = "../crates/vhalla-room-activity" }
vhalla-rooms = { path = "../crates/vhalla-rooms" }
vhalla-rooms-consensus = { path = "../crates/vhalla-rooms-consensus" }

[[bin]]
name = "vhalla-browser"
path = "src/bin/app.rs"

[[bin]]
name = "vhalla-vault-worker"
path = "src/bin/worker.rs"

[lints]
workspace = true
