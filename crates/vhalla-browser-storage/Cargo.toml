[package]
name = "vhalla-browser-storage"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Bounded opaque browser images with exact IndexedDB compare-and-swap."

[dependencies]
vhalla-browser-vault = { path = "../vhalla-browser-vault" }
vhalla-room-activity = { path = "../vhalla-room-activity" }
vhalla-public-protocol = { path = "../vhalla-public-protocol" }
sha2 = { version = "=0.10.9", default-features = false }

[dev-dependencies]
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = "0.3"
js-sys = "=0.3.85"
wasm-bindgen = "=0.2.108"
web-sys = { version = "=0.3.85", features = ["Window", "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbObjectStore", "IdbKeyRange", "Event", "DomStringList"] }

[target.'cfg(unix)'.dependencies]
vhalla-custody = { path = "../vhalla-custody" }

[lints]
workspace = true
