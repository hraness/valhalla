[package]
name = "vhalla-steel-thread"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Fast end-to-end Valhalla steel-thread prototype."

[dependencies]
vhalla-crypto = { path = "../vhalla-crypto" }
vhalla-core = { path = "../vhalla-core" }
vhalla-host = { path = "../vhalla-host" }
vhalla-policy = { path = "../vhalla-policy" }
vhalla-wire = { path = "../vhalla-wire" }
vhalla-transport = { path = "../vhalla-transport" }

[dev-dependencies]
proptest = "1.6"
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc"] }
vhalla-social = { path = "../vhalla-social" }
vhalla-discovery = { path = "../vhalla-discovery" }
vhalla-attention = { path = "../vhalla-attention" }
vhalla-session = { path = "../vhalla-session" }
hegeltest = "0.46.0"

[target.'cfg(unix)'.dev-dependencies]
vhalla-identity = { path = "../vhalla-identity" }
vhalla-native = { path = "../vhalla-native" }
tokio = { version = "1.53", default-features = false, features = ["macros", "rt", "time"] }
getrandom = "0.3"

[[bin]]
name = "vhalla-steel-thread"
path = "src/main.rs"

[lints]
workspace = true
