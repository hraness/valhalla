[package]
name = "vhalla-public-protocol"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Bounded signed route advertisements for public non-validator peers."

[dependencies]
vhalla-botcaptcha = { path = "../vhalla-botcaptcha" }
vhalla-core = { path = "../vhalla-core" }
vhalla-witness = { path = "../vhalla-witness" }
vhalla-room-activity = { path = "../vhalla-room-activity" }
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc"] }

sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
vhalla-rooms = { path = "../vhalla-rooms" }

[lints]
workspace = true
