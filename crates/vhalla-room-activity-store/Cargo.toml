[package]
name = "vhalla-room-activity-store"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Durable local append-only public room activity with bounded disk reads."

[dependencies]
sha2 = "0.10"
vhalla-core = { path = "../vhalla-core" }
vhalla-custody = { path = "../vhalla-custody" }
vhalla-room-activity = { path = "../vhalla-room-activity" }
vhalla-rooms = { path = "../vhalla-rooms" }

[dev-dependencies]
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc"] }
getrandom = "0.3"
vhalla-social = { path = "../vhalla-social" }

[lints]
workspace = true
