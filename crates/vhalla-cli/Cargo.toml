[package]
name = "vhalla-cli"
version = "0.3.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Valhalla command line entry point."

[features]
default = ["headless"]
headless = ["experimental-private", "tokio/net", "tokio/io-util", "tokio/io-std", "tokio/sync", "dep:base64", "dep:vhalla-direct-room", "dep:vhalla-direct-store", "dep:vhalla-direct-native", "dep:vhalla-direct-sync", "vhalla-private-native/direct-rooms", "dep:iroh"]
experimental-network = ["dep:vhalla-native", "dep:vhalla-session", "dep:tokio", "dep:vhalla-core", "dep:getrandom"]
experimental-social = ["vhalla-identity/social", "dep:vhalla-social", "dep:vhalla-social-store", "dep:vhalla-core", "dep:getrandom", "dep:libc", "dep:vhalla-discovery", "dep:vhalla-attention", "dep:vhalla-discovery-store"]
experimental-rooms = ["experimental-social", "vhalla-identity/rooms", "dep:vhalla-rooms", "dep:vhalla-rooms-store"]
experimental-rooms-node = ["experimental-rooms", "dep:vhalla-rooms-node", "dep:vhalla-rooms-consensus", "dep:vhalla-journal", "dep:tokio", "dep:getrandom", "dep:tracing-subscriber"]
experimental-rooms-tui = ["experimental-rooms-node", "dep:vhalla-rooms-app", "dep:vhalla-rooms-tui"]
experimental-sync = ["experimental-social", "experimental-network", "dep:vhalla-retrieval"]

experimental-public = ["experimental-rooms-node", "vhalla-identity/room-activity", "dep:vhalla-room-activity", "dep:vhalla-room-activity-store", "dep:vhalla-browser-storage", "dep:vhalla-public-client", "dep:vhalla-public-peer", "dep:vhalla-public-protocol", "dep:vhalla-rooms-app"]

experimental-private = ["dep:vhalla-private-native", "vhalla-private-native/relay-iroh", "vhalla-private-native/habitat-link", "vhalla-private-native/agent-rpc", "dep:vhalla-private-kernel", "dep:vhalla-custody", "dep:zeroize", "dep:tokio", "dep:getrandom", "dep:rcgen", "dep:time"]

[dependencies]
anyhow = "1"
base64 = { version = "0.22.1", optional = true }
hraness-cli-update = { git = "https://github.com/hraness/cli-update", tag = "v0.1.0", version = "=0.1.0" }
hraness-control-kit = { git = "https://github.com/hraness/desktop-foundation", tag = "v0.9.0", default-features = false }
hraness-support-foundation = { git = "https://github.com/hraness/support-foundation", rev = "b32c1c81bb2444f50509ed54388758ecfab1f1c0" }
vhalla-identity = { path = "../vhalla-identity" }
vhalla-room-activity = { path = "../vhalla-room-activity", optional = true }
vhalla-room-activity-store = { path = "../vhalla-room-activity-store", optional = true }
vhalla-browser-storage = { path = "../vhalla-browser-storage", optional = true }
vhalla-public-client = { path = "../vhalla-public-client", optional = true }
vhalla-public-protocol = { path = "../vhalla-public-protocol", optional = true }
vhalla-social = { path = "../vhalla-social", optional = true }
vhalla-discovery = { path = "../vhalla-discovery", optional = true }
vhalla-attention = { path = "../vhalla-attention", optional = true }
vhalla-core = { path = "../vhalla-core", optional = true }
vhalla-rooms = { path = "../vhalla-rooms", optional = true }
getrandom = { version = "0.3", optional = true }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Private-room client crates are portable: the Windows build keeps member-side
# `private` commands while host, gateway and agent serving stay Unix-gated.
vhalla-private-native = { path = "../vhalla-private-native", features = ["client"], optional = true }
vhalla-private-kernel = { path = "../vhalla-private-kernel", optional = true }
vhalla-direct-room = { path = "../vhalla-direct-room", optional = true }
vhalla-direct-store = { path = "../vhalla-direct-store", optional = true }
vhalla-direct-native = { path = "../vhalla-direct-native", optional = true }
vhalla-direct-sync = { path = "../vhalla-direct-sync", optional = true }
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"], optional = true }
vhalla-custody = { path = "../vhalla-custody", optional = true }
zeroize = { version = "1", optional = true }
tokio = { version = "1.53", default-features = false, features = ["rt", "rt-multi-thread", "time", "signal", "macros"], optional = true }
time = { version = "=0.3.55", default-features = false, features = ["std"], optional = true }

[target.'cfg(unix)'.dependencies]
# `status`, `tui`, `commands` and `doctor`: the shared envelope, verb registry
# and terminal views. Pinned to the immutable v0.9.0 release tag.
hraness-control-kit = { git = "https://github.com/hraness/desktop-foundation", tag = "v0.9.0", features = ["tui"] }
rustix = { version = "=1.1.4", features = ["event", "fs", "stdio", "process"] }
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "ring"], optional = true }
vhalla-public-peer = { path = "../vhalla-public-peer", optional = true }
libc = { version = "0.2", optional = true }
vhalla-social-store = { path = "../vhalla-social-store", optional = true }
vhalla-rooms-store = { path = "../vhalla-rooms-store", optional = true }
vhalla-discovery-store = { path = "../vhalla-discovery-store", optional = true }
vhalla-native = { path = "../vhalla-native", optional = true }
vhalla-session = { path = "../vhalla-session", optional = true }
vhalla-rooms-consensus = { path = "../vhalla-rooms-consensus", optional = true }
vhalla-journal = { path = "../vhalla-journal", optional = true }
vhalla-rooms-node = { path = "../vhalla-rooms-node", optional = true }
vhalla-rooms-app = { path = "../vhalla-rooms-app", optional = true }
vhalla-rooms-tui = { path = "../vhalla-rooms-tui", optional = true }
vhalla-retrieval = { path = "../vhalla-retrieval", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tempfile = "3"
bip39 = { version = "2.2", default-features = false, features = ["std"] }
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "ring"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc"] }
getrandom = "0.3"
serde_json = "1"
sha2 = "0.10"
vhalla-core = { path = "../vhalla-core" }
vhalla-rooms-consensus = { path = "../vhalla-rooms-consensus", features = ["fixture"] }
vhalla-rooms-node = { path = "../vhalla-rooms-node" }
vhalla-social-store = { path = "../vhalla-social-store" }
hegeltest = "0.46.0"

[[bin]]
name = "vhalla"
path = "src/main.rs"

# These journeys exercise optional legacy commands. Keep them in the matching
# feature builds instead of compiling empty test crates in the headless build.
[[test]]
name = "network"
required-features = ["experimental-network"]

[[test]]
name = "social_sync"
required-features = ["experimental-sync"]

[[test]]
name = "rooms_tailcat"
required-features = ["experimental-rooms-node"]

[[test]]
name = "rooms_overlay"
required-features = ["experimental-rooms-node"]

[[test]]
name = "public_serve"
required-features = ["experimental-public"]

[[test]]
name = "public_network"
required-features = ["experimental-public"]

[[test]]
name = "public_activity_network"
required-features = ["experimental-public"]

[[test]]
name = "public_discovery"
required-features = ["experimental-public"]

[[test]]
name = "public_activity"
required-features = ["experimental-public"]

[[test]]
name = "private_iroh"
required-features = ["experimental-private"]

[[test]]
name = "private_agent"
required-features = ["experimental-private"]

[[test]]
name = "private_host"
required-features = ["experimental-private"]

[[test]]
name = "private_steel_thread"
required-features = ["experimental-private"]

[[test]]
name = "private_agent_delivery"
required-features = ["experimental-private"]

[[test]]
name = "private_rooms"
required-features = ["experimental-private"]

[lints]
workspace = true
