[package]
name = "vhalla-private-native"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true


[features]
default = []
client = ["dep:vhalla-identity"]

[target.'cfg(unix)'.dependencies]
vhalla-identity = { path = "../vhalla-identity", features = ["private-storage"], optional = true }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits"] }
sha2 = { version = "=0.10.9", default-features = false }
vhalla-custody = { path = "../vhalla-custody" }

vhalla-private-kernel = { path = "../vhalla-private-kernel" }

[dev-dependencies]
futures = "=0.3.34"
ed25519-dalek = "=2.2.0"

[lints]
workspace = true
