[package]
name = "vhalla-private-native"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true


[features]
default = []
client = ["dep:vhalla-identity"]
agent-rpc = ["client", "dep:serde_json"]
relay-tls = ["dep:rustls"]

[dependencies]
vhalla-private-relay = { path = "../vhalla-private-relay" }
vhalla-identity = { path = "../vhalla-identity", features = ["private-storage"], optional = true }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits"] }
sha2 = { version = "=0.10.9", default-features = false }
vhalla-custody = { path = "../vhalla-custody" }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"], optional = true }
serde_json = { version = "1", optional = true }
vhalla-private-kernel = { path = "../vhalla-private-kernel" }

[dev-dependencies]
futures = "=0.3.34"
ed25519-dalek = "=2.2.0"
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "ring"] }
hegeltest = "0.46.0"

[lints]
workspace = true
