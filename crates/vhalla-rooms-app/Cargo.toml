[package]
name = "vhalla-rooms-app"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Renderer-agnostic room-directory service: a read replica of a node's committed journal plus bounded submission intents."

[dependencies]
vhalla-core = { path = "../vhalla-core" }
vhalla-journal = { path = "../vhalla-journal" }
vhalla-rooms = { path = "../vhalla-rooms" }
vhalla-rooms-consensus = { path = "../vhalla-rooms-consensus" }
vhalla-rooms-node = { path = "../vhalla-rooms-node" }
vhalla-social = { path = "../vhalla-social" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
vhalla-social-store = { path = "../vhalla-social-store" }

[dev-dependencies]
vhalla-rooms-consensus = { path = "../vhalla-rooms-consensus", features = ["fixture"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
