[package]
name = "vhalla-crypto"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Signed Valhalla envelopes and replay protection."

[dependencies]
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
vhalla-core = { path = "../vhalla-core" }
vhalla-wire = { path = "../vhalla-wire" }

[dev-dependencies]
hegeltest = "0.46.0"
proptest = "1.6"

[lints]
workspace = true
