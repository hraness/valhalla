[package]
name = "vhalla-rooms-consensus"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Journal-gated consensus adapter over the room registry and social snapshot stores."

[dependencies]
vhalla-core = { path = "../vhalla-core" }
vhalla-journal = { path = "../vhalla-journal" }
vhalla-rooms = { path = "../vhalla-rooms" }
vhalla-rooms-store = { path = "../vhalla-rooms-store" }
vhalla-social = { path = "../vhalla-social" }
vhalla-social-store = { path = "../vhalla-social-store" }
sha2 = "0.10"

[dev-dependencies]
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc"] }

[lints]
workspace = true
