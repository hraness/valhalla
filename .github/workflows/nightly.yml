name: Nightly

# The complete Rust/site gate on main every night, including every prototype,
# Kani, browser journey and formal model that pull requests and main pushes
# skip when their inputs did not change (.github/scripts/verify_scope.py).
# A failure keeps the run red and opens, or comments on, one tracking issue;
# the next green night closes it.
on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/rust.yml
    # A reusable workflow's jobs cannot exceed the caller's token scope; the
    # Rust workflow's change-filter job requests pull-requests: read.
    permissions:
      contents: read
      pull-requests: read

  report:
    name: Nightly tracking issue
    needs: gate
    if: always() && github.ref == 'refs/heads/main' && (needs.gate.result == 'success' || needs.gate.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.gate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          title="Nightly full verification is failing"
          number="$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")"
          if [ "$RESULT" = success ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$REPO" --comment "Green again on ${SHA::12}: $RUN_URL"
            fi
            exit 0
          fi
          body="The nightly full gate failed on ${SHA::12}: $RUN_URL

          Pull requests run only the prototypes, Kani proofs, browser journeys and formal models their changes reach, so this may be the first run to see the failure. Fix forward on main; the next green nightly closes this issue."
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "Still failing on ${SHA::12}: $RUN_URL"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
