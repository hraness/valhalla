name: Iroh independent runners

# Advisory qualification of disposable test mailboxes. A public relay outage
# fails this evidence run without redefining the deterministic Rust Required gate.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/vhalla-private-native/src/relay/iroh.rs
      - crates/vhalla-private-native/src/relay/iroh/**
      - crates/vhalla-private-native/src/relay/tls/service.rs
      - crates/vhalla-private-native/Cargo.toml
      - Cargo.lock
      - .github/workflows/iroh-qualification.yml
      - .github/scripts/iroh_qualification.py
      - .github/scripts/test_iroh_qualification.py

permissions:
  contents: read

concurrency:
  group: iroh-qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: short

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: iroh-qualification
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Controller failure and evidence contracts
        run: python3 -m unittest discover -s .github/scripts -p test_iroh_qualification.py
      - name: Compile the native fixture once
        run: |
          cargo test --no-run --lib --locked -p vhalla-private-native --features agent-rpc,relay-iroh --message-format=json > "$RUNNER_TEMP/iroh-build.jsonl"
          python3 .github/scripts/iroh_qualification.py package --cargo-messages "$RUNNER_TEMP/iroh-build.jsonl" --bundle "$RUNNER_TEMP/iroh-bundle"
      - uses: actions/upload-artifact@v7
        with:
          name: iroh-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iroh-bundle/
          if-no-files-found: error
          retention-days: 3

  host:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: iroh-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iroh-bundle
      - name: Start the bounded synthetic host supervisor
        run: python3 .github/scripts/iroh_qualification.py host-start --bundle "$RUNNER_TEMP/iroh-bundle" --work "$RUNNER_TEMP/iroh-host"
      - name: Publish the short-lived synthetic descriptor while the host runs
        uses: actions/upload-artifact@v7
        with:
          name: iroh-descriptor-${{ github.run_id }}-${{ github.run_attempt }}
          # This file has only the public endpoint and a newly generated token
          # limited to eight synthetic records. No endpoint secret is uploaded.
          path: ${{ runner.temp }}/iroh-host/descriptor.json
          if-no-files-found: error
          retention-days: 1
      - name: Await this run's client and verify durable host shutdown
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/iroh_qualification.py host-wait --work "$RUNNER_TEMP/iroh-host"
      - name: Always stop and reap the exact owned fixture
        if: always()
        run: python3 .github/scripts/iroh_qualification.py host-stop --work "$RUNNER_TEMP/iroh-host"
      - name: Retain sanitized host evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iroh-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iroh-host/host-receipt.json
          if-no-files-found: error
          retention-days: 14

  client:
    # Do not depend on host: its descriptor is available before its job exits.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: iroh-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iroh-bundle
      - name: Exercise production client and independently observed forced relay
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/iroh_qualification.py client --bundle "$RUNNER_TEMP/iroh-bundle" --work "$RUNNER_TEMP/iroh-client"
      - name: Publish sanitized completion even after failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iroh-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iroh-client/client-receipt.json
          if-no-files-found: error
          retention-days: 14

  result:
    name: Qualification result
    if: always()
    needs: [build, host, client]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both independent roles and their cleanup to succeed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          HOST_RESULT: ${{ needs.host.result }}
          CLIENT_RESULT: ${{ needs.client.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$HOST_RESULT" = success
          test "$CLIENT_RESULT" = success
