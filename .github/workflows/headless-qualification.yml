name: Headless independent runners

# Advisory live evidence. Provider availability does not redefine the
# deterministic Required gate. Each room mode uses its own pair of runners.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headless-qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: short

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: headless-qualification
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check controller failure and evidence contracts
        run: |
          python3 -m unittest discover -s .github/scripts -p '*qualification.py'
          python3 -m unittest discover -s .github/scripts -p 'test_headless_measurement.py'
      - name: Compile the actual headless CLI once
        run: |
          cargo build --release --locked -p vhalla-cli --bin vhalla --no-default-features --features headless --message-format=json > "$RUNNER_TEMP/headless-build.jsonl"
          python3 .github/scripts/headless_qualification.py package --cargo-messages "$RUNNER_TEMP/headless-build.jsonl" --bundle "$RUNNER_TEMP/headless-bundle"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-bundle/
          if-no-files-found: error
          retention-days: 3

  host:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: headless-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-bundle
      - name: Start the synthetic public room owner
        run: python3 .github/scripts/headless_qualification.py host-start --bundle "$RUNNER_TEMP/headless-bundle" --work "$RUNNER_TEMP/headless-host"
      - name: Publish the public room link
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-descriptor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-host/descriptor.json
          if-no-files-found: error
          retention-days: 1
      - name: Admit this run's member and wait for its offline transition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/headless_qualification.py host-admit --work "$RUNNER_TEMP/headless-host"
          python3 .github/scripts/headless_qualification.py host-offline --work "$RUNNER_TEMP/headless-host"
      - name: Publish the replacement peer after stopping the owner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-host-offline-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-host/host-offline-ready.json
          if-no-files-found: error
          retention-days: 1
      - name: Await the member's verified catch-up and stop the replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/headless_qualification.py host-wait --work "$RUNNER_TEMP/headless-host"
      - name: Always join the exact owned host processes
        if: always()
        run: python3 .github/scripts/headless_qualification.py host-stop --work "$RUNNER_TEMP/headless-host"
      - name: Retain sanitized host evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-host/host-receipt.json
          if-no-files-found: error
          retention-days: 14

  client:
    # Descriptor exchange happens while both independent jobs are running.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: headless-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-bundle
      - name: Verify the room link and join without writer authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/headless_qualification.py client-start --bundle "$RUNNER_TEMP/headless-bundle" --work "$RUNNER_TEMP/headless-client"
      - name: Publish the member's public identity and peer link
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-client-offer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-client/client-offer.json
          if-no-files-found: error
          retention-days: 1
      - name: Exchange signed messages and stop the member
        run: python3 .github/scripts/headless_qualification.py client-offline --work "$RUNNER_TEMP/headless-client"
      - name: Publish the offline transition
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-client-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-client/client-offline.json
          if-no-files-found: error
          retention-days: 1
      - name: Restart retained state and catch up from the replacement peer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/headless_qualification.py client-wait --work "$RUNNER_TEMP/headless-client"
      - name: Always join the exact owned member processes
        if: always()
        run: python3 .github/scripts/headless_qualification.py client-stop --work "$RUNNER_TEMP/headless-client"
      - name: Retain sanitized member evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-client/client-receipt.json
          if-no-files-found: error
          retention-days: 14

  private-host:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: headless-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-bundle
      - name: Start a disposable private mailbox and room owner
        run: python3 .github/scripts/headless_private_qualification.py host-start --bundle "$RUNNER_TEMP/headless-bundle" --work "$RUNNER_TEMP/headless-private-host"
      # These short-retention handoffs contain fresh synthetic bootstrap data.
      # Tokens have no cryptographic expiry; always-stop closes their mailbox.
      - name: Share this run's mailbox setup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-private-descriptor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-private-host/descriptor.json
          if-no-files-found: error
          retention-days: 1
      - name: Offer membership to both synthetic clients
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/headless_private_qualification.py host-offers --work "$RUNNER_TEMP/headless-private-host"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-private-host-offers-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-private-host/host-offers.json
          if-no-files-found: error
          retention-days: 1
      - name: Accept this run's membership requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/headless_private_qualification.py host-admit --work "$RUNNER_TEMP/headless-private-host"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-private-host-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-private-host/host-admission.json
          if-no-files-found: error
          retention-days: 1
      - name: Verify acceptance and send while the member is offline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/headless_private_qualification.py host-offline --work "$RUNNER_TEMP/headless-private-host"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-private-host-offline-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-private-host/host-offline-ready.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove the caught-up member and prove delivery after rekey
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/headless_private_qualification.py host-remove --work "$RUNNER_TEMP/headless-private-host"
          python3 .github/scripts/headless_private_qualification.py host-wait --work "$RUNNER_TEMP/headless-private-host"
      - name: Always join the exact owned private host processes
        if: always()
        run: python3 .github/scripts/headless_private_qualification.py host-stop --work "$RUNNER_TEMP/headless-private-host"
      - name: Retain sanitized private host evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-private-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-private-host/host-receipt.json
          if-no-files-found: error
          retention-days: 14

  private-client:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: headless-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-bundle
      - name: Create two clients for this run's private host
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/headless_private_qualification.py client-start --bundle "$RUNNER_TEMP/headless-bundle" --work "$RUNNER_TEMP/headless-private-client"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-private-client-hello-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-private-client/client-hello.json
          if-no-files-found: error
          retention-days: 1
      - name: Request membership using the pinned owner offers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/headless_private_qualification.py client-requests --work "$RUNNER_TEMP/headless-private-client"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-private-client-requests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-private-client/client-requests.json
          if-no-files-found: error
          retention-days: 1
      - name: Exchange private messages and stop one member
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/headless_private_qualification.py client-offline --work "$RUNNER_TEMP/headless-private-client"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-private-client-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-private-client/client-offline.json
          if-no-files-found: error
          retention-days: 1
      - name: Restart the member and verify catch-up without duplicate messages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/headless_private_qualification.py client-restart --work "$RUNNER_TEMP/headless-private-client"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-private-client-caught-up-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-private-client/client-caught-up.json
          if-no-files-found: error
          retention-days: 1
      - name: Verify removal survives restart and the remaining member decrypts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/headless_private_qualification.py client-wait --work "$RUNNER_TEMP/headless-private-client"
      - name: Always join the exact owned private client processes
        if: always()
        run: python3 .github/scripts/headless_private_qualification.py client-stop --work "$RUNNER_TEMP/headless-private-client"
      - name: Retain sanitized private client evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-private-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-private-client/client-receipt.json
          if-no-files-found: error
          retention-days: 14

  linux-managed:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: headless-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-bundle
      - name: Prepare this disposable runner's real systemd user manager
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          runner_user_id="$(id -u)"
          test "$runner_user_id" -ne 0
          timeout 20s sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$runner_user_id"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          for ((attempt=0; attempt<40; attempt++)); do
            if timeout 2s systemctl --user show-environment >/dev/null 2>&1; then
              printf 'XDG_RUNTIME_DIR=%s\nDBUS_SESSION_BUS_ADDRESS=%s\n' "$XDG_RUNTIME_DIR" "$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 0.5
          done
          echo "The runner's user manager did not become ready." >&2
          exit 1
      - name: Exercise the actual release daemon as a managed Linux service
        run: python3 .github/scripts/headless_linux_managed_qualification.py run --bundle "$RUNNER_TEMP/headless-bundle" --work "$RUNNER_TEMP/headless-linux-managed"
      - name: Always remove only this run's exact managed unit
        if: always()
        run: python3 .github/scripts/headless_linux_managed_qualification.py cleanup --bundle "$RUNNER_TEMP/headless-bundle" --work "$RUNNER_TEMP/headless-linux-managed"
      - name: Retain sanitized Linux managed evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-linux-managed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/headless-linux-managed/receipt.json
            ${{ runner.temp }}/headless-linux-managed/cleanup-receipt.json
          if-no-files-found: error
          retention-days: 14

  mcp:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: headless-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-bundle
      - name: Verify this run's release bundle and exercise the MCP process
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, '.github/scripts')
          from headless_linux_managed_qualification import bundle_identity
          root = Path(os.environ['RUNNER_TEMP'])
          binary, manifest, _ = bundle_identity(root / 'headless-bundle', seal=True)
          os.execv(sys.executable, [sys.executable, '.github/scripts/headless_mcp_qualification.py',
              '--binary', str(binary), '--binary-sha256', manifest['binary_sha256'],
              '--source-sha', manifest['source_sha'], '--work', str(root / 'headless-mcp')])
          PY
      - name: Retain sanitized MCP process evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headless-mcp-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-mcp/receipt.json
          if-no-files-found: error
          retention-days: 14

  result:
    name: Headless qualification result
    if: always()
    needs: [build, host, client, private-host, private-client, linux-managed, mcp]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every role and its cleanup to succeed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          HOST_RESULT: ${{ needs.host.result }}
          CLIENT_RESULT: ${{ needs.client.result }}
          PRIVATE_HOST_RESULT: ${{ needs.private-host.result }}
          PRIVATE_CLIENT_RESULT: ${{ needs.private-client.result }}
          LINUX_MANAGED_RESULT: ${{ needs.linux-managed.result }}
          MCP_RESULT: ${{ needs.mcp.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$HOST_RESULT" = success
          test "$CLIENT_RESULT" = success
          test "$PRIVATE_HOST_RESULT" = success
          test "$PRIVATE_CLIENT_RESULT" = success
          test "$LINUX_MANAGED_RESULT" = success
          test "$MCP_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Exact names only: do not download short-lived private bootstrap handoffs.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: headless-binary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-result/binary
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: headless-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-result/public-host
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: headless-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-result/public-client
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: headless-private-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-result/private-host
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: headless-private-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-result/private-client
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: headless-linux-managed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-result/linux-managed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: headless-mcp-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/headless-result/mcp
      - name: Bind exact receipts to this source, build, run, attempt and cleanup
        run: |
          python3 .github/scripts/headless_result_qualification.py \
            --artifacts "$RUNNER_TEMP/headless-result" --lockfile Cargo.lock \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
