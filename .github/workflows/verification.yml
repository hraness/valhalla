name: Verification

# Verus functional-verification of the ledger admission model.
# Kani harnesses for the journal codec are intentionally local-only:
# CBMC is too slow and too resource-hungry for GitHub's free runners
# to complete within an acceptable PR gate.
on:
  pull_request:
    paths:
      - "verify/**"
      - ".github/workflows/verification.yml"
  push:
    branches: [main]
    paths:
      - "verify/**"
      - ".github/workflows/verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verus:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal
      - name: Install Verus 0.2026.09.13.671956e
        run: |
          curl -sSfL https://github.com/verus-lang/verus/releases/download/release/0.2026.09.13.671956e/verus-0.2026.09.13.671956e-x86-linux.zip -o verus.zip
          unzip -q verus.zip
      - run: ./verus-x86-linux/verus --crate-type=lib verify/ledger.rs
