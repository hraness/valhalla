name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: workspace
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Delivery and security regression tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  workspace-tests:
    name: Workspace tests (${{ matrix.name }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # vhalla-rooms-node is ~17min serial; the named long poles run in
          # dedicated lanes while the residual lane --skips them, so a new
          # test automatically lands in rooms-node and can never go uncovered.
          - name: rooms-node-heavy-a
            packages: -p vhalla-rooms-node
            args: -- unix::tests::wal_tail_stays_bounded_over_long_run unix::tests::validator_set_rotates_at_activation_boundary
          - name: rooms-node-heavy-b
            packages: -p vhalla-rooms-node
            args: -- unix::tests::decided_history_survives_interleaved_restarts unix::tests::sweep_decided_retires_exactly_dead_state unix::tests::tombstone_ids_stay_injected_across_drawn_slots unix::tests::wal_append_failure_safety_halts_then_recovers
          - name: rooms-node
            packages: -p vhalla-rooms-node
            args: -- --skip wal_tail_stays_bounded_over_long_run --skip validator_set_rotates_at_activation_boundary --skip decided_history_survives_interleaved_restarts --skip sweep_decided_retires_exactly_dead_state --skip tombstone_ids_stay_injected_across_drawn_slots --skip wal_append_failure_safety_halts_then_recovers
          # The cli live-mesh suite spawns real `rooms node` subprocesses;
          # its longest poles run in a dedicated lane while the residual
          # lane --skips them, same split discipline as rooms-node above.
          - name: cli-heavy
            packages: -p vhalla-cli
            args: -- enabled::live_mesh_soak_duplicate_churn_rotation_converges enabled::live_mesh_full_restart_resumes_mid_flight enabled::live_mesh_rotates_validator_set_mid_flight
          - name: cli
            packages: -p vhalla-cli
            args: -- --skip enabled::live_mesh_soak_duplicate_churn_rotation_converges --skip enabled::live_mesh_full_restart_resumes_mid_flight --skip enabled::live_mesh_rotates_validator_set_mid_flight
          - name: stateful-storage
            packages: -p vhalla-rooms-consensus -p vhalla-rooms-store -p vhalla-social-store -p vhalla-discovery-store -p vhalla-identity -p vhalla-native -p vhalla-ledger
          - name: public-network
            packages: -p vhalla-public-protocol -p vhalla-private-protocol -p vhalla-public-client -p vhalla-public-peer -p vhalla-room-activity -p vhalla-room-activity-store -p vhalla-browser-storage -p vhalla-browser-vault -p vhalla-browser
          - name: remaining
            packages: -p vhalla-core -p vhalla-wire -p vhalla-crypto -p vhalla-policy -p vhalla-host -p vhalla-steel-thread -p vhalla-botcaptcha -p vhalla-witness -p vhalla-game-platonik -p vhalla-rooms -p vhalla-social -p vhalla-journal -p vhalla-custody -p vhalla-transport -p vhalla-attention -p vhalla-discovery -p vhalla-session -p vhalla-retrieval -p vhalla-rooms-app -p vhalla-rooms-tui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: workspace
      - run: cargo test ${{ matrix.packages }} --all-targets --all-features --locked ${{ matrix.args }}
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Retain failed live-mesh soak diagnostics
        if: failure() && matrix.name == 'cli-heavy'
        uses: actions/upload-artifact@v4
        with:
          name: cli-heavy-soak-diagnostics
          path: ${{ runner.temp }}/vhalla-cli-node-soak-*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  workspace-aux:
    name: Workspace auxiliary checks
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: workspace-aux
          cache-all-crates: true
      - name: Documentation and feature tests
        run: |
          cargo test --workspace --doc --all-features --locked
          cargo test -p vhalla-cli --no-default-features --test identity --locked
          cargo test -p vhalla-cli --no-default-features --test social --locked
          cargo test -p vhalla-cli --features experimental-game --test game --locked
      - name: WASM pure crate checks
        run: |
          cargo check -p vhalla-core -p vhalla-wire -p vhalla-crypto -p vhalla-policy -p vhalla-ledger -p vhalla-session -p vhalla-social -p vhalla-discovery -p vhalla-attention -p vhalla-retrieval -p vhalla-rooms -p vhalla-rooms-app -p vhalla-journal -p vhalla-rooms-consensus -p vhalla-rooms-node -p vhalla-witness -p vhalla-botcaptcha -p vhalla-game-platonik -p vhalla-public-protocol -p vhalla-private-protocol -p vhalla-public-client -p vhalla-room-activity -p vhalla-browser-storage -p vhalla-browser-vault -p vhalla-browser --target wasm32-unknown-unknown --locked
          cargo check --manifest-path prototypes/checkpoint-proof/Cargo.toml --target wasm32-unknown-unknown --locked
          cargo check --manifest-path prototypes/checkpoint-ledger/Cargo.toml --target wasm32-unknown-unknown --locked
          cargo check --manifest-path prototypes/agent-portraits/Cargo.toml --lib --target wasm32-unknown-unknown --locked
          cargo check --manifest-path prototypes/social-lifecycle/Cargo.toml --lib --target wasm32-unknown-unknown --locked
          cargo check --manifest-path prototypes/social-reducer/Cargo.toml --lib --target wasm32-unknown-unknown --locked
          cargo check --manifest-path prototypes/social-sync/Cargo.toml --lib --target wasm32-unknown-unknown --locked
          cargo check --manifest-path prototypes/room-registry/Cargo.toml --lib --target wasm32-unknown-unknown --locked
          cargo check --manifest-path prototypes/game-wasm-parity/Cargo.toml --lib --target wasm32-unknown-unknown --locked
          cargo check --manifest-path prototypes/browser-records/Cargo.toml --target wasm32-unknown-unknown --locked
          cargo check --manifest-path prototypes/browser-records/interop/Cargo.toml --lib --target wasm32-unknown-unknown --locked
      - name: Signed discovery native and WASM execution parity
        run: |
          cargo install wasm-bindgen-cli --version 0.2.108 --locked
          cargo fetch --manifest-path prototypes/discovery-parity/Cargo.toml --locked
          sh prototypes/discovery-parity/verify.sh
      - name: Independent signed facet golden vectors
        run: python3 prototypes/social-facets/verify-vectors.py
      - name: Independent witness encoding golden vectors
        run: python3 prototypes/witness-vectors/verify-vectors.py
      - name: Independent game session golden vectors
        run: python3 prototypes/witness-vectors/verify-game-vectors.py
      - name: Native checkpoint persistence
        run: |
          cargo test --manifest-path prototypes/checkpoint-ledger/Cargo.toml --features native-store --locked
          cargo clippy --manifest-path prototypes/checkpoint-ledger/Cargo.toml --all-targets --features native-store --locked -- -D warnings
      - name: Browser record fixture native checks
        run: |
          cargo fmt --manifest-path prototypes/browser-records/interop/Cargo.toml -- --check
          cargo test --manifest-path prototypes/browser-records/interop/Cargo.toml --locked
          cargo clippy --manifest-path prototypes/browser-records/interop/Cargo.toml --all-targets --locked -- -D warnings
      - name: Portrait SVG vocabulary and golden vectors
        run: |
          cargo run --manifest-path prototypes/agent-portraits/Cargo.toml --example gallery --locked -- /tmp/valhalla-portrait-check
          python3 prototypes/agent-portraits/verify.py /tmp/valhalla-portrait-check
      - name: Retained native admission reference integrity
        working-directory: prototypes/browser-records/interop/native-admission-reference
        run: sha256sum --check SHA256SUMS
      - name: DNS compatibility backport tests
        run: cargo test --locked --manifest-path vendor/libp2p-dns/Cargo.toml --features tokio -- backport_

  browser-artifact:
    name: Browser production artifact
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: browser-artifact
          cache-all-crates: true
      - name: Browser and portable adapter lint
        run: cargo clippy --locked -p vhalla-browser -p vhalla-browser-storage -p vhalla-browser-vault --target wasm32-unknown-unknown -- -D warnings
      - name: Install pinned Trunk
        run: cargo install trunk --locked --version 0.21.14
      - name: Build production without local qualification routes
        working-directory: browser
        run: |
          trunk --skip-version-check build --release --locked
          python3 tools/package.py dist
          python3 -m unittest discover -s tools -p 'test_*.py'
        env:
          NO_COLOR: "true"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Qualification process cleanup regressions
        run: node --test browser/tools/qualification_lifecycle.test.mjs
      - name: Install exact browser bindings for runtime qualification
        run: cargo install wasm-bindgen-cli --version 0.2.108 --locked
      - name: Build isolated storage and MLS worker fixtures
        run: |
          cargo build --locked -p vhalla-browser-storage --example indexeddb_qualification --target wasm32-unknown-unknown
          wasm-bindgen target/wasm32-unknown-unknown/debug/examples/indexeddb_qualification.wasm --target web --out-dir "$RUNNER_TEMP/vhalla-storage-runtime"
          cargo build --locked --manifest-path prototypes/private-rooms-mls/Cargo.toml --target wasm32-unknown-unknown
          wasm-bindgen prototypes/private-rooms-mls/target/wasm32-unknown-unknown/debug/valhalla_private_rooms_mls_qualification.wasm --target web --out-name private_rooms_mls --out-dir "$RUNNER_TEMP/vhalla-mls-runtime"
      - name: Exercise real IndexedDB and MLS in dedicated workers
        run: |
          chrome=$(command -v google-chrome)
          node browser/tools/qualify_storage.mjs "$RUNNER_TEMP/vhalla-storage-runtime" "$chrome"
          node prototypes/private-rooms-mls/tools/qualify_browser.mjs "$RUNNER_TEMP/vhalla-mls-runtime" "$chrome" "$RUNNER_TEMP/vhalla-mls-results"
      - name: Build isolated public browser journey
        run: |
          cargo build --locked -p vhalla-public-peer --example browser_fixture
          cd browser
          trunk --skip-version-check build --release --locked --features local-qualification --dist "$RUNNER_TEMP/vhalla-product-runtime"
          python3 tools/package.py "$RUNNER_TEMP/vhalla-product-runtime" --allow-local-qualification
        env:
          NO_COLOR: "true"
      - name: Exercise scope, interrupted signing, puzzle review and peer delivery
        run: node browser/tools/qualify_product.mjs "$RUNNER_TEMP/vhalla-product-runtime" "$GITHUB_WORKSPACE/target/debug/examples/browser_fixture" "$(command -v google-chrome)" "$RUNNER_TEMP/vhalla-product-results" --recovery
      - name: Retain bounded browser runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vhalla-browser-runtime-evidence
          path: |
            ${{ runner.temp }}/vhalla-storage-runtime/indexeddb-receipt.json
            ${{ runner.temp }}/vhalla-storage-runtime/chromium.stderr.log
            ${{ runner.temp }}/vhalla-mls-results/receipt.json
            ${{ runner.temp }}/vhalla-mls-results/chrome.log
            ${{ runner.temp }}/vhalla-product-results/receipt.json
            ${{ runner.temp }}/vhalla-product-results/*.log
            ${{ runner.temp }}/vhalla-product-results/*.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: vhalla-browser
          path: browser/dist
          if-no-files-found: error
          retention-days: 14

  check:
    if: always()
    needs: [quality, workspace-tests, workspace-aux, browser-artifact, prototype-checks, kani-spent, desktop, site, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Rust gate
        env:
          QUALITY: ${{ needs.quality.result }}
          WORKSPACE_TESTS: ${{ needs.workspace-tests.result }}
          WORKSPACE_AUX: ${{ needs.workspace-aux.result }}
          BROWSER: ${{ needs.browser-artifact.result }}
          PROTOTYPES: ${{ needs.prototype-checks.result }}
          KANI: ${{ needs.kani-spent.result }}
          DESKTOP: ${{ needs.desktop.result }}
          SITE: ${{ needs.site.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          test "$QUALITY" = success
          test "$WORKSPACE_TESTS" = success
          test "$WORKSPACE_AUX" = success
          test "$BROWSER" = success
          test "$PROTOTYPES" = success
          test "$KANI" = success
          test "$DESKTOP" = success
          test "$SITE" = success
          test "$SECURITY" = success
  list-prototypes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      manifests: ${{ steps.find.outputs.manifests }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          manifests=$(find prototypes -maxdepth 2 -name Cargo.toml | jq -R . | jq -cs .)
          echo "manifests=$manifests" >> "$GITHUB_OUTPUT"
  prototype-checks:
    needs: list-prototypes
    if: needs.list-prototypes.outputs.manifests != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        manifest: ${{ fromJSON(needs.list-prototypes.outputs.manifests) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path "${{ matrix.manifest }}" -- --check
      - name: Test
        run: cargo test --manifest-path "${{ matrix.manifest }}" --locked
      - name: Clippy
        run: cargo clippy --manifest-path "${{ matrix.manifest }}" --all-targets --locked -- -D warnings
  kani-spent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Kani
        run: |
          cargo install --locked --version 0.68.0 kani-verifier
          cargo kani setup
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Verify bounded spent-nonce core
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          cargo kani -p vhalla-native --output-format terse -Z unstable-options --harness-timeout 300s
          git diff --exit-code -- Cargo.lock
  desktop:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: desktop
      - name: Menubar build
        run: cargo build --locked --manifest-path desktop/Cargo.toml
      - name: Menubar tests
        run: cargo test --locked --manifest-path desktop/Cargo.toml

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked site dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Site tests and production build
        run: bun run check:site
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static site responsive, keyboard and CSP qualification
        run: node site/tools/qualify_browser.mjs "$GITHUB_WORKSPACE/site/dist" "$(command -v google-chrome)" "$RUNNER_TEMP/vhalla-site-results" "$GITHUB_WORKSPACE/vercel.json"
      - name: Retain site visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vhalla-site-visual-evidence
          path: |
            ${{ runner.temp }}/vhalla-site-results/receipt.json
            ${{ runner.temp }}/vhalla-site-results/chrome.log
            ${{ runner.temp }}/vhalla-site-results/*.png
          if-no-files-found: warn
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned advisory checker
        run: cargo install --locked --version 0.22.2 cargo-audit
      - name: Audit maintained graphs and retain raw lockfile findings
        run: python3 .github/scripts/audit_dependencies.py --output-dir "$RUNNER_TEMP/security-reports"
      - name: Retain complete security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: ${{ runner.temp }}/security-reports
          if-no-files-found: error
          retention-days: 14
