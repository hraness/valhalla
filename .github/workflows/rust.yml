name: Rust

on:
  workflow_dispatch:
    inputs:
      production:
        description: Also verify the fixed vhalla.com public site
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
  pull_request:
  workflow_call:
    outputs:
      browser_manifest_sha256:
        description: Manifest commitment from the successful production delivery journey
        value: ${{ jobs.browser-artifact.outputs.manifest_sha256 }}

permissions:
  contents: read

# Pull requests cancel their superseded runs. Main, dispatch and release runs
# group by commit so a later merge never cancels an earlier commit's gate.
concurrency:
  group: rust-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Default-to-run change filter. A pull request skips the Rust, browser and
  # platform gates only when EVERY changed path is on the non-Rust allowlist
  # below; any other path (including new top-level directories and vectors/)
  # runs everything. Pushes to main, dispatches and release calls always run
  # everything. `formal` also runs for docs/ because verify/cases.json binds
  # model correspondence to documents there.
  changes:
    name: Change filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      formal: ${{ steps.filter.outputs.formal }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          rust=true
          formal=true
          if [ "$EVENT" = pull_request ]; then
            rows="$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[] | [.filename, (.previous_filename // "")] | @tsv')"
            count="$(printf '%s\n' "$rows" | sed '/^$/d' | wc -l | tr -d ' ')"
            paths="$(printf '%s\n' "$rows" | tr '\t' '\n' | sed '/^$/d')"
            nonrust='^((site|docs|kb)/.+|bun\.lock|package\.json|vercel\.json|\.vercelignore|LICENSE|railway\.toml|[^/]+\.md)$'
            # The files API lists at most 3,000 paths; anything incomplete runs everything.
            # Here-strings, not `printf | grep -q`: under pipefail an early
            # grep -q match SIGPIPEs printf on lists over the 64 KiB pipe
            # buffer, and the `!` would turn that into a false skip.
            if [ "$count" -gt 0 ] && [ "$count" = "$CHANGED_FILES" ] \
              && ! grep -Evq "$nonrust" <<<"$paths" \
              && ! grep -qx 'CHANGELOG.md' <<<"$paths"; then
              rust=false
              if ! grep -q '^docs/' <<<"$paths"; then
                formal=false
              fi
            fi
            printf 'Changed paths (%s):\n%s\n' "$count" "$paths"
          fi
          printf 'rust=%s formal=%s\n' "$rust" "$formal"
          printf 'rust=%s\nformal=%s\n' "$rust" "$formal" >> "$GITHUB_OUTPUT"

  main-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Audit public checked-PR enforcement
        run: python3 .github/scripts/check_main_policy.py --public-view
        env:
          GH_TOKEN: ${{ github.token }}
  formal:
    needs: changes
    if: needs.changes.outputs.formal == 'true'
    uses: ./.github/workflows/verification.yml
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: quality
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Delivery and security regression tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Dead-device recovery policy counterexample
        run: python3 -m unittest discover -s prototypes/device-recovery-policy -p 'test_*.py'
      - name: Fixed-room disclosure broker model
        run: python3 -m unittest discover -s prototypes/agent-compartment -p 'test_*.py'
      - name: Private runtime measurement contracts
        run: python3 -m unittest discover -s crates/vhalla-cli/tools -p 'test_*.py'

  workspace-tests:
    name: Workspace tests (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # `cache` names the rust-cache key: lanes that compile the same
        # package set share one. Lanes run under cargo-nextest (one process per
        # test, all test binaries of a lane in parallel) unless `harness` is
        # libtest (see the cli and private-rooms lanes below).
        include:
          # vhalla-rooms-node is ~17min serial; the named long poles run in
          # dedicated lanes while the residual lane --skips them, so a new
          # test automatically lands in rooms-node and can never go uncovered.
          - name: rooms-node-heavy-a
            cache: rooms-node
            packages: -p vhalla-rooms-node
            args: -- unix::tests::wal_tail_stays_bounded_over_long_run unix::tests::validator_set_rotates_at_activation_boundary
          - name: rooms-node-heavy-b
            cache: rooms-node
            packages: -p vhalla-rooms-node
            args: -- unix::tests::decided_history_survives_interleaved_restarts unix::tests::sweep_decided_retires_exactly_dead_state unix::tests::tombstone_ids_stay_injected_across_drawn_slots unix::tests::wal_append_failure_safety_halts_then_recovers
          - name: rooms-node
            cache: rooms-node
            packages: -p vhalla-rooms-node
            args: -- --skip wal_tail_stays_bounded_over_long_run --skip validator_set_rotates_at_activation_boundary --skip decided_history_survives_interleaved_restarts --skip sweep_decided_retires_exactly_dead_state --skip tombstone_ids_stay_injected_across_drawn_slots --skip wal_append_failure_safety_halts_then_recovers
          # The cli live-mesh suite spawns real `rooms node` subprocesses;
          # its longest poles run in a dedicated lane while the residual
          # lane --skips them, same split discipline as rooms-node above.
          # vhalla-cli's rooms_node suite serializes its four-process mesh
          # tests with an in-process mutex that nextest would not honour.
          - name: cli-heavy
            cache: cli
            harness: libtest
            packages: -p vhalla-cli
            args: -- enabled::live_mesh_soak_duplicate_churn_rotation_converges enabled::live_mesh_full_restart_resumes_mid_flight enabled::live_mesh_rotates_validator_set_mid_flight
          - name: cli
            cache: cli
            harness: libtest
            packages: -p vhalla-cli
            args: -- --skip enabled::live_mesh_soak_duplicate_churn_rotation_converges --skip enabled::live_mesh_full_restart_resumes_mid_flight --skip enabled::live_mesh_rotates_validator_set_mid_flight
          - name: stateful-storage
            cache: stateful-storage
            packages: -p vhalla-rooms-consensus -p vhalla-rooms-store -p vhalla-social-store -p vhalla-discovery-store -p vhalla-identity -p vhalla-native -p vhalla-ledger
          # One room-activity-store test runs ~7.5 min on its own; it gets a
          # lane that compiles only its crate, and public-network --skips it.
          - name: public-network-heavy
            cache: room-activity-store
            packages: -p vhalla-room-activity-store
            args: -- unix::tests::lifetime_history_exceeds_social_archive_limit_with_bounded_pages
          - name: public-network
            cache: public-network
            packages: -p vhalla-public-protocol -p vhalla-private-protocol -p vhalla-public-client -p vhalla-public-peer -p vhalla-room-activity -p vhalla-room-activity-store -p vhalla-browser-storage -p vhalla-browser-vault -p vhalla-browser
            args: -- --skip unix::tests::lifetime_history_exceeds_social_archive_limit_with_bounded_pages
          - name: discovery-advertisements
            cache: discovery-advertisements
            packages: -p arc-malachitebft-network -p arc-malachitebft-config -p arc-malachitebft-app
          # The private relay HTTP tests (relay::http::tests, real iroh
          # upstream) race their fixture startup when started in a fresh
          # process: under nextest, shutdown(Write) hit ENOTCONN in run
          # 36525563105. Keep libtest here until that fixture waits for
          # readiness.
          - name: private-rooms
            cache: private-rooms
            harness: libtest
            packages: -p vhalla-private-kernel -p vhalla-private-native -p vhalla-private-relay
          - name: remaining
            cache: remaining
            packages: -p vhalla-core -p vhalla-wire -p vhalla-crypto -p vhalla-policy -p vhalla-host -p vhalla-steel-thread -p vhalla-botcaptcha -p vhalla-witness -p vhalla-rooms -p vhalla-social -p vhalla-journal -p vhalla-custody -p vhalla-transport -p vhalla-attention -p vhalla-discovery -p vhalla-session -p vhalla-retrieval -p vhalla-rooms-app -p vhalla-rooms-tui
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: tests-${{ matrix.cache }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        if: matrix.harness != 'libtest'
        with:
          tool: cargo-nextest@0.9.146
      # Doctests are not run by nextest or `--all-targets`; workspace-aux runs
      # `cargo test --workspace --doc`.
      - name: Test (nextest)
        if: matrix.harness != 'libtest'
        run: cargo nextest run ${{ matrix.packages }} --all-targets --all-features --locked --no-fail-fast ${{ matrix.args }}
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Test (libtest)
        if: matrix.harness == 'libtest'
        run: cargo test ${{ matrix.packages }} --all-targets --all-features --locked ${{ matrix.args }}
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Retain failed live-mesh soak diagnostics
        if: failure() && matrix.name == 'cli-heavy'
        uses: actions/upload-artifact@v7
        with:
          name: cli-heavy-soak-diagnostics
          path: ${{ runner.temp }}/vhalla-cli-node-soak-*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # Whole-workspace `cargo check` coverage: every crate compile-checks for
  # x86_64-pc-windows-msvc today (Unix-specific internals are `cfg(unix)`
  # modules inside portable crates, not Unix-only crates). The private client
  # build below also proves the member-side `identity` + `private` surface
  # links on MSVC — host, gateway and agent serving remain Unix-gated and no
  # Windows release packaging is claimed. Test targets compile only for the
  # crates whose dev-dependencies are pure Rust; the rest pull C-backed
  # dev-deps (hegeltest) that this lane does not yet qualify. vhalla-custody
  # runs its full lint and test suite on the Windows backend. Do not widen
  # silently: only what this lane verifies belongs in it.
  windows-portable:
    name: Windows portable checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: workspace-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Custody lint and tests
        run: |
          cargo clippy -p vhalla-custody --all-targets --all-features --locked -- -D warnings
          cargo test -p vhalla-custody --all-targets --locked
      - name: Workspace compile coverage
        run: cargo check --workspace --locked
      - name: Private client link coverage
        run: cargo build --locked -p vhalla-cli --no-default-features --features experimental-private --bin vhalla
      - name: Portable core test-code compile coverage
        run: cargo check -p vhalla-wire -p vhalla-policy -p vhalla-witness -p vhalla-botcaptcha -p vhalla-public-protocol -p vhalla-private-protocol -p vhalla-public-client -p vhalla-room-activity -p vhalla-private-relay -p vhalla-rooms-app --all-targets --locked

  workspace-aux:
    name: Workspace auxiliary checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: workspace-aux
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Documentation and feature tests
        run: |
          cargo test --workspace --doc --all-features --locked
          cargo test -p vhalla-cli --no-default-features --test identity --locked
          cargo test -p vhalla-cli --no-default-features --test social --locked
      - name: WASM pure crate checks
        run: |
          cargo check -p vhalla-core -p vhalla-wire -p vhalla-crypto -p vhalla-policy -p vhalla-ledger -p vhalla-session -p vhalla-social -p vhalla-discovery -p vhalla-attention -p vhalla-retrieval -p vhalla-rooms -p vhalla-rooms-app -p vhalla-journal -p vhalla-rooms-consensus -p vhalla-rooms-node -p vhalla-witness -p vhalla-botcaptcha -p vhalla-public-protocol -p vhalla-private-protocol -p vhalla-public-client -p vhalla-room-activity -p vhalla-browser-storage -p vhalla-browser-vault -p vhalla-browser --target wasm32-unknown-unknown --locked
          cargo check -p vhalla-private-kernel -p vhalla-private-relay -p vhalla-browser-storage -p vhalla-browser-vault --features vhalla-browser-storage/private-rooms,vhalla-browser-vault/private-storage --target wasm32-unknown-unknown --locked
          cargo check --manifest-path prototypes/checkpoint-proof/Cargo.toml --target wasm32-unknown-unknown --locked
          cargo check --manifest-path prototypes/checkpoint-ledger/Cargo.toml --target wasm32-unknown-unknown --locked
          cargo check --manifest-path prototypes/agent-portraits/Cargo.toml --lib --target wasm32-unknown-unknown --locked
          cargo check --manifest-path prototypes/social-lifecycle/Cargo.toml --lib --target wasm32-unknown-unknown --locked
          cargo check --manifest-path prototypes/social-reducer/Cargo.toml --lib --target wasm32-unknown-unknown --locked
          cargo check --manifest-path prototypes/social-sync/Cargo.toml --lib --target wasm32-unknown-unknown --locked
          cargo check --manifest-path prototypes/room-registry/Cargo.toml --lib --target wasm32-unknown-unknown --locked
          cargo check --manifest-path prototypes/browser-records/Cargo.toml --target wasm32-unknown-unknown --locked
          cargo check --manifest-path prototypes/browser-records/interop/Cargo.toml --lib --target wasm32-unknown-unknown --locked
      - name: Signed discovery native and WASM execution parity
        run: |
          cargo install wasm-bindgen-cli --version 0.2.108 --locked
          cargo fetch --manifest-path prototypes/discovery-parity/Cargo.toml --locked
          sh prototypes/discovery-parity/verify.sh
      - name: Independent signed facet golden vectors
        run: python3 prototypes/social-facets/verify-vectors.py
      - name: Independent witness encoding golden vectors
        run: python3 prototypes/witness-vectors/verify-vectors.py
      - name: Native checkpoint persistence
        run: |
          cargo test --manifest-path prototypes/checkpoint-ledger/Cargo.toml --features native-store --locked
          cargo clippy --manifest-path prototypes/checkpoint-ledger/Cargo.toml --all-targets --features native-store --locked -- -D warnings
      - name: Browser record fixture native checks
        run: |
          cargo fmt --manifest-path prototypes/browser-records/interop/Cargo.toml -- --check
          cargo test --manifest-path prototypes/browser-records/interop/Cargo.toml --locked
          cargo clippy --manifest-path prototypes/browser-records/interop/Cargo.toml --all-targets --locked -- -D warnings
      - name: Portrait SVG vocabulary and golden vectors
        run: |
          cargo run --manifest-path prototypes/agent-portraits/Cargo.toml --example gallery --locked -- /tmp/valhalla-portrait-check
          python3 prototypes/agent-portraits/verify.py /tmp/valhalla-portrait-check
      - name: Retained native admission reference integrity
        working-directory: prototypes/browser-records/interop/native-admission-reference
        run: sha256sum --check SHA256SUMS
      - name: DNS compatibility backport tests
        run: cargo test --locked --manifest-path vendor/libp2p-dns/Cargo.toml --features tokio -- backport_

  # The browser qualification is four independent jobs. Only this one builds
  # the production bundle, binds it to its delivery receipt, and uploads the
  # `vhalla-browser` artifact that release.yml packages.
  browser-artifact:
    name: Browser production artifact
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      manifest_sha256: ${{ steps.qualified-browser.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: browser-artifact
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Browser and portable adapter lint
        run: cargo clippy --locked -p vhalla-browser -p vhalla-browser-storage -p vhalla-browser-vault --features vhalla-browser/private-rooms,vhalla-browser-storage/private-rooms,vhalla-browser-vault/private-storage --target wasm32-unknown-unknown -- -D warnings
      # The production artifact's Trunk is built from source on purpose
      # (published bytes come from a crates.io-locked toolchain, not a
      # prebuilt download); rust-cache restores ~/.cargo/bin so a warm run
      # skips the compile. Qualification-only builds below use the prebuilt.
      - name: Install pinned Trunk
        run: cargo install trunk --locked --version 0.21.14
      - name: Build production without local qualification routes
        working-directory: browser
        run: |
          trunk --skip-version-check build --release --locked --features private-rooms
          python3 tools/package.py dist
          python3 -m unittest discover -s tools -p 'test_*.py'
        env:
          NO_COLOR: "true"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Qualification process cleanup regressions
        run: node --test browser/tools/qualification_lifecycle.test.mjs browser/tools/qualification_process_guardian.test.mjs browser/tools/private_mixed_pilot.test.mjs browser/tools/private_generation_pilot.test.mjs
      - name: Build maintained local private host and browser gateway
        run: cargo build --locked -p vhalla-cli --features experimental-private
      - name: Exercise production browser delivery, outage and exact restart
        timeout-minutes: 8
        run: node browser/tools/qualify_private_delivery.mjs "$GITHUB_WORKSPACE/browser/dist" "$(command -v google-chrome)" "$RUNNER_TEMP/vhalla-private-delivery-results" "$GITHUB_WORKSPACE/target/debug/vhalla" "$(command -v openssl)"
      - name: Complete private work with a browser and two native agents
        run: node browser/tools/qualify_private_delivery.mjs "$GITHUB_WORKSPACE/browser/dist" "$(command -v google-chrome)" "$RUNNER_TEMP/vhalla-private-mixed-results" "$GITHUB_WORKSPACE/target/debug/vhalla" "$(command -v openssl)" --mixed-pilot
      - name: Exercise production private panel and archive recovery
        run: node browser/tools/qualify_private_panel.mjs "$GITHUB_WORKSPACE/browser/dist" "$(command -v google-chrome)" "$RUNNER_TEMP/vhalla-private-production-panel-results" --production
      - name: Retain bounded browser runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vhalla-browser-runtime-evidence
          path: |
            ${{ runner.temp }}/vhalla-private-delivery-results/receipt.json
            ${{ runner.temp }}/vhalla-private-delivery-results/*.log
            ${{ runner.temp }}/vhalla-private-delivery-results/*.png
            ${{ runner.temp }}/vhalla-private-mixed-results/receipt.json
            ${{ runner.temp }}/vhalla-private-mixed-results/*.log
            ${{ runner.temp }}/vhalla-private-mixed-results/*.png
            ${{ runner.temp }}/vhalla-private-production-panel-results/receipt.json
            ${{ runner.temp }}/vhalla-private-production-panel-results/*.log
            ${{ runner.temp }}/vhalla-private-production-panel-results/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Bind the upload to the successful production delivery receipt
        id: qualified-browser
        run: |
          digest="$(python3 .github/scripts/verify_browser_artifact.py browser/dist --receipt "$RUNNER_TEMP/vhalla-private-delivery-results/receipt.json")"
          printf 'manifest_sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: vhalla-browser
          path: browser/dist
          if-no-files-found: error
          retention-days: 14

  browser-worker:
    name: Browser private worker journey
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: browser-worker
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - name: Check optional private room worker and local qualification entry points
        run: cargo clippy --locked -p vhalla-browser --features private-rooms,local-qualification --target wasm32-unknown-unknown -- -D warnings
      - name: Build isolated private room worker journey
        working-directory: browser
        run: |
          trunk --skip-version-check build --release --locked --features private-rooms,local-qualification --dist "$RUNNER_TEMP/vhalla-private-worker-runtime"
          python3 tools/package.py "$RUNNER_TEMP/vhalla-private-worker-runtime" --allow-local-qualification
        env:
          NO_COLOR: "true"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise private worker custody, cancellation and exact reopen
        run: node browser/tools/qualify_private_session.mjs "$RUNNER_TEMP/vhalla-private-worker-runtime" "$(command -v google-chrome)" "$RUNNER_TEMP/vhalla-private-worker-results"
      - name: Exercise private room invitations, consent and file exchange through the UI
        run: node browser/tools/qualify_private_panel.mjs "$RUNNER_TEMP/vhalla-private-worker-runtime" "$(command -v google-chrome)" "$RUNNER_TEMP/vhalla-private-panel-results"
      - name: Retain bounded browser runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vhalla-browser-worker-evidence
          path: |
            ${{ runner.temp }}/vhalla-private-worker-results/receipt.json
            ${{ runner.temp }}/vhalla-private-worker-results/*.log
            ${{ runner.temp }}/vhalla-private-panel-results/receipt.json
            ${{ runner.temp }}/vhalla-private-panel-results/*.log
            ${{ runner.temp }}/vhalla-private-panel-results/*.png
          if-no-files-found: warn
          retention-days: 14

  browser-storage:
    name: Browser storage and MLS fixtures
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: browser-storage
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            prototypes/private-rooms-mls -> target
      - name: Install exact browser bindings for runtime qualification
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.108
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check archive and continuity receipt browser fixtures
        run: cargo clippy --locked -p vhalla-browser-storage --example private_archive_indexeddb --example private_archive_recovery --example continuity_indexeddb --features private-archive-qualification,continuity-qualification --target wasm32-unknown-unknown -- -D warnings
      - name: Build archive and continuity receipt browser fixtures
        run: |
          cargo build --locked -p vhalla-browser-storage --example private_archive_indexeddb --example private_archive_recovery --example continuity_indexeddb --features private-archive-qualification,continuity-qualification --target wasm32-unknown-unknown
          wasm-bindgen target/wasm32-unknown-unknown/debug/examples/private_archive_indexeddb.wasm --target web --out-name indexeddb_qualification --out-dir "$RUNNER_TEMP/vhalla-private-archive-runtime"
          wasm-bindgen target/wasm32-unknown-unknown/debug/examples/private_archive_recovery.wasm --target web --out-name archive_recovery --out-dir "$RUNNER_TEMP/vhalla-archive-recovery-runtime"
          wasm-bindgen target/wasm32-unknown-unknown/debug/examples/continuity_indexeddb.wasm --target web --out-name indexeddb_qualification --out-dir "$RUNNER_TEMP/vhalla-continuity-runtime"
      - name: Exercise archive and receipt recovery in Window and dedicated worker
        run: |
          chrome=$(command -v google-chrome)
          node browser/tools/qualify_storage.mjs "$RUNNER_TEMP/vhalla-private-archive-runtime" "$chrome"
          node prototypes/browser-archive-recovery/qualify.mjs "$RUNNER_TEMP/vhalla-archive-recovery-runtime" "$chrome" "$RUNNER_TEMP/vhalla-archive-recovery-results"
          node browser/tools/qualify_storage.mjs "$RUNNER_TEMP/vhalla-continuity-runtime" "$chrome"
      - name: Check account-derived private browser custody fixture
        run: cargo clippy --locked -p vhalla-browser-storage --example private_custody_indexeddb --features private-custody-qualification --target wasm32-unknown-unknown -- -D warnings
      - name: Build account-derived private browser custody fixture
        run: |
          cargo build --locked -p vhalla-browser-storage --example private_custody_indexeddb --features private-custody-qualification --target wasm32-unknown-unknown
          wasm-bindgen target/wasm32-unknown-unknown/debug/examples/private_custody_indexeddb.wasm --target web --out-name indexeddb_qualification --out-dir "$RUNNER_TEMP/vhalla-private-custody-runtime"
      - name: Exercise account-derived custody in Window and dedicated worker
        run: |
          chrome=$(command -v google-chrome)
          node browser/tools/qualify_storage.mjs "$RUNNER_TEMP/vhalla-private-custody-runtime" "$chrome"
      - name: Build isolated storage and MLS worker fixtures
        run: |
          cargo build --locked -p vhalla-browser-storage --example indexeddb_qualification --target wasm32-unknown-unknown
          wasm-bindgen target/wasm32-unknown-unknown/debug/examples/indexeddb_qualification.wasm --target web --out-dir "$RUNNER_TEMP/vhalla-storage-runtime"
          cargo build --locked -p vhalla-browser-storage --example private_mls_indexeddb --example private_indexeddb --features private-rooms,qualification --target wasm32-unknown-unknown
          wasm-bindgen target/wasm32-unknown-unknown/debug/examples/private_mls_indexeddb.wasm --target web --out-name indexeddb_qualification --out-dir "$RUNNER_TEMP/vhalla-private-group-runtime"
          wasm-bindgen target/wasm32-unknown-unknown/debug/examples/private_indexeddb.wasm --target web --out-name indexeddb_qualification --out-dir "$RUNNER_TEMP/vhalla-private-store-runtime"
          cargo build --locked --manifest-path prototypes/private-rooms-mls/Cargo.toml --target wasm32-unknown-unknown
          wasm-bindgen prototypes/private-rooms-mls/target/wasm32-unknown-unknown/debug/valhalla_private_rooms_mls_qualification.wasm --target web --out-name private_rooms_mls --out-dir "$RUNNER_TEMP/vhalla-mls-runtime"
      - name: Exercise real IndexedDB and MLS in dedicated workers
        run: |
          chrome=$(command -v google-chrome)
          node browser/tools/qualify_storage.mjs "$RUNNER_TEMP/vhalla-storage-runtime" "$chrome"
          node browser/tools/qualify_storage.mjs "$RUNNER_TEMP/vhalla-private-store-runtime" "$chrome"
          node browser/tools/qualify_storage.mjs "$RUNNER_TEMP/vhalla-private-group-runtime" "$chrome"
          node prototypes/private-rooms-mls/tools/qualify_browser.mjs "$RUNNER_TEMP/vhalla-mls-runtime" "$chrome" "$RUNNER_TEMP/vhalla-mls-results"
      - name: Retain bounded browser runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vhalla-browser-storage-evidence
          path: |
            ${{ runner.temp }}/vhalla-storage-runtime/indexeddb-receipt.json
            ${{ runner.temp }}/vhalla-storage-runtime/chromium.stderr.log
            ${{ runner.temp }}/vhalla-private-store-runtime/indexeddb-receipt.json
            ${{ runner.temp }}/vhalla-private-store-runtime/chromium.stderr.log
            ${{ runner.temp }}/vhalla-private-group-runtime/indexeddb-receipt.json
            ${{ runner.temp }}/vhalla-private-group-runtime/chromium.stderr.log
            ${{ runner.temp }}/vhalla-private-custody-runtime/indexeddb-receipt.json
            ${{ runner.temp }}/vhalla-private-custody-runtime/chromium.stderr.log
            ${{ runner.temp }}/vhalla-private-archive-runtime/indexeddb-receipt.json
            ${{ runner.temp }}/vhalla-private-archive-runtime/chromium.stderr.log
            ${{ runner.temp }}/vhalla-continuity-runtime/indexeddb-receipt.json
            ${{ runner.temp }}/vhalla-continuity-runtime/chromium.stderr.log
            ${{ runner.temp }}/vhalla-mls-results/receipt.json
            ${{ runner.temp }}/vhalla-mls-results/chrome.log
          if-no-files-found: warn
          retention-days: 14

  browser-public:
    name: Browser public journey
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: browser-public
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - name: Build isolated public browser journey
        run: |
          # Real 20-bit discovery work keeps its fixed deadline; qualify the
          # optimized fixture rather than debug SHA-256 throughput on CI hosts.
          cargo build --release --locked -p vhalla-public-peer --example browser_fixture
          cd browser
          trunk --skip-version-check build --release --locked --features local-qualification --dist "$RUNNER_TEMP/vhalla-product-runtime"
          python3 tools/package.py "$RUNNER_TEMP/vhalla-product-runtime" --allow-local-qualification
        env:
          NO_COLOR: "true"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise scope, interrupted signing, puzzle review and peer delivery
        run: node browser/tools/qualify_product.mjs "$RUNNER_TEMP/vhalla-product-runtime" "$GITHUB_WORKSPACE/target/release/examples/browser_fixture" "$(command -v google-chrome)" "$RUNNER_TEMP/vhalla-product-results" --recovery
      - name: Retain bounded browser runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vhalla-browser-public-evidence
          path: |
            ${{ runner.temp }}/vhalla-product-results/receipt.json
            ${{ runner.temp }}/vhalla-product-results/*.log
            ${{ runner.temp }}/vhalla-product-results/*.png
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Required
    if: always()
    needs: [changes, quality, workspace-tests, windows-portable, workspace-aux, browser-artifact, browser-worker, browser-storage, browser-public, prototype-checks, kani-spent, formal, main-policy, desktop, site, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Rust gate
        env:
          CHANGES: ${{ needs.changes.result }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          FORMAL_CHANGED: ${{ needs.changes.outputs.formal }}
          QUALITY: ${{ needs.quality.result }}
          WORKSPACE_TESTS: ${{ needs.workspace-tests.result }}
          WINDOWS_PORTABLE: ${{ needs.windows-portable.result }}
          WORKSPACE_AUX: ${{ needs.workspace-aux.result }}
          BROWSER: ${{ needs.browser-artifact.result }}
          BROWSER_WORKER: ${{ needs.browser-worker.result }}
          BROWSER_STORAGE: ${{ needs.browser-storage.result }}
          BROWSER_PUBLIC: ${{ needs.browser-public.result }}
          PROTOTYPES: ${{ needs.prototype-checks.result }}
          KANI: ${{ needs.kani-spent.result }}
          DESKTOP: ${{ needs.desktop.result }}
          SITE: ${{ needs.site.result }}
          SECURITY: ${{ needs.security.result }}
          FORMAL: ${{ needs.formal.result }}
          MAIN_POLICY: ${{ needs.main-policy.result }}
        run: |
          failed=0
          # Unconditional gates must succeed.
          must() {
            if [ "$2" != success ]; then
              echo "::error::$1 is $2"
              failed=1
            fi
          }
          # Filtered gates succeed, or skip only because the change filter
          # (which itself succeeded) reported their inputs unchanged.
          filtered() {
            if [ "$2" = success ]; then
              return
            fi
            if [ "$2" = skipped ] && [ "$CHANGES" = success ] && [ "$3" = false ]; then
              echo "$1 skipped: no inputs changed"
              return
            fi
            echo "::error::$1 is $2"
            failed=1
          }
          must changes "$CHANGES"
          must quality "$QUALITY"
          must site "$SITE"
          must main-policy "$MAIN_POLICY"
          filtered workspace-tests "$WORKSPACE_TESTS" "$RUST_CHANGED"
          filtered windows-portable "$WINDOWS_PORTABLE" "$RUST_CHANGED"
          filtered workspace-aux "$WORKSPACE_AUX" "$RUST_CHANGED"
          filtered browser-artifact "$BROWSER" "$RUST_CHANGED"
          filtered browser-worker "$BROWSER_WORKER" "$RUST_CHANGED"
          filtered browser-storage "$BROWSER_STORAGE" "$RUST_CHANGED"
          filtered browser-public "$BROWSER_PUBLIC" "$RUST_CHANGED"
          filtered prototype-checks "$PROTOTYPES" "$RUST_CHANGED"
          filtered kani-spent "$KANI" "$RUST_CHANGED"
          filtered desktop "$DESKTOP" "$RUST_CHANGED"
          filtered security "$SECURITY" "$RUST_CHANGED"
          filtered formal "$FORMAL" "$FORMAL_CHANGED"
          exit "$failed"
  list-prototypes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      manifests: ${{ steps.find.outputs.manifests }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: |
          manifests=$(find prototypes -maxdepth 2 -name Cargo.toml | jq -R . | jq -cs .)
          echo "manifests=$manifests" >> "$GITHUB_OUTPUT"
  prototype-checks:
    needs: [changes, list-prototypes]
    if: needs.changes.outputs.rust == 'true' && needs.list-prototypes.outputs.manifests != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        manifest: ${{ fromJSON(needs.list-prototypes.outputs.manifests) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path "${{ matrix.manifest }}" -- --check
      - name: Test
        run: cargo test --manifest-path "${{ matrix.manifest }}" --locked
      - name: Clippy
        run: cargo clippy --manifest-path "${{ matrix.manifest }}" --all-targets --locked -- -D warnings
  kani-spent:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Kani
        run: |
          cargo install --locked --version 0.68.0 kani-verifier
          cargo kani setup
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Verify bounded spent-nonce core
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          cargo kani -p vhalla-native --output-format terse -Z unstable-options --harness-timeout 300s
          git diff --exit-code -- Cargo.lock
  desktop:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Menubar build
        run: cargo build --locked --manifest-path desktop/Cargo.toml
      - name: Menubar tests
        run: cargo test --locked --manifest-path desktop/Cargo.toml
      - name: Lint menu fixtures
        run: >-
          npx --yes
          --package=https://github.com/hraness/desktop-foundation/releases/download/v0.8.0/hraness-desktop-foundation-0.8.0.tgz
          companion lint-menu --strict desktop/menubar/fixtures/*.json
      - name: Synthetic macOS agent compartment denial probes
        run: python3 prototypes/agent-compartment/qualify_macos.py

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked site dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Site tests and production build
        run: bun run check:site
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static site responsive, keyboard and CSP qualification
        run: node site/tools/qualify_browser.mjs "$GITHUB_WORKSPACE/site/dist" "$(command -v google-chrome)" "$RUNNER_TEMP/vhalla-site-results" "$GITHUB_WORKSPACE/vercel.json"
      - name: Every public page at phone and desktop sizes in both themes
        run: node site/tools/qualify_browser.mjs "$GITHUB_WORKSPACE/site/dist" "$(command -v google-chrome)" "$RUNNER_TEMP/vhalla-public-site-results" "$GITHUB_WORKSPACE/vercel.json" --public-pages
      - name: Fixed production public-page verification
        if: github.event_name == 'workflow_dispatch' && inputs.production
        run: node site/tools/qualify_browser.mjs "$GITHUB_WORKSPACE/site/dist" "$(command -v google-chrome)" "$RUNNER_TEMP/vhalla-production-site-results" "$GITHUB_WORKSPACE/vercel.json" --production
      - name: Retain site visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vhalla-site-visual-evidence
          path: |
            ${{ runner.temp }}/vhalla-site-results/receipt.json
            ${{ runner.temp }}/vhalla-site-results/chrome.log
            ${{ runner.temp }}/vhalla-site-results/*.png
            ${{ runner.temp }}/vhalla-public-site-results/*.json
            ${{ runner.temp }}/vhalla-public-site-results/*.png
            ${{ runner.temp }}/vhalla-production-site-results/*.json
            ${{ runner.temp }}/vhalla-production-site-results/*.png
          if-no-files-found: warn
          retention-days: 14

  security:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned advisory checker
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit maintained graphs and retain raw lockfile findings
        run: python3 .github/scripts/audit_dependencies.py --output-dir "$RUNNER_TEMP/security-reports"
      - name: Retain complete security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: ${{ runner.temp }}/security-reports
          if-no-files-found: error
          retention-days: 14
