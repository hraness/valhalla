name: Release

# Every tag reuses the native Rust/site gate at that exact commit. Builders
# stage the five native archives in parallel with it; only the publisher,
# which needs the gate and every native builder, can write a GitHub release.
# The retained browser app has explicit opt-in verification in rust.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: short

jobs:
  validate:
    uses: ./.github/workflows/rust.yml
    # A reusable workflow's jobs cannot exceed the caller's token scope; the
    # Rust workflow's change-filter job requests pull-requests: read.
    permissions:
      contents: read
      pull-requests: read

  # Builders only stage artifacts, so they start with validation instead of
  # after it; publish still needs validate and every builder.
  cli:
    # Each archive gets a signed build provenance attestation
    # (`gh attestation verify ARCHIVE --repo hraness/valhalla`).
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            tool: build
          # musl produces a fully static binary that runs on any distro and
          # inside scratch/distroless images; the gnu artifact stays glibc-bound
          # to the ubuntu-latest runner's version.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            tool: zigbuild
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            tool: zigbuild
          # Windows carries identity custody and the member side of private
          # rooms; every Unix-only command names the Linux build (WSL).
          # Not Authenticode-signed.
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            tool: build
            features: experimental-private
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    outputs:
      linux_gnu_artifact_id: ${{ steps.producer.outputs.linux_gnu_artifact_id }}
      linux_gnu_artifact_digest: ${{ steps.producer.outputs.linux_gnu_artifact_digest }}
      linux_musl_artifact_id: ${{ steps.producer.outputs.linux_musl_artifact_id }}
      linux_musl_artifact_digest: ${{ steps.producer.outputs.linux_musl_artifact_digest }}
      linux_arm64_artifact_id: ${{ steps.producer.outputs.linux_arm64_artifact_id }}
      linux_arm64_artifact_digest: ${{ steps.producer.outputs.linux_arm64_artifact_digest }}
      windows_artifact_id: ${{ steps.producer.outputs.windows_artifact_id }}
      windows_artifact_digest: ${{ steps.producer.outputs.windows_artifact_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        if: matrix.tool == 'zigbuild'
        with:
          tool: cargo-zigbuild
      - name: Install zig (checksum-verified)
        if: matrix.tool == 'zigbuild'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Build vhalla
        # Ship the daemon and its native clients. The complete
        # all-features verification gate still runs above.
        env:
          VHALLA_BUILD_RELEASE_TAG: ${{ github.ref_name }}
        run: cargo ${{ matrix.tool }} --release --locked -p vhalla-cli --no-default-features --features ${{ matrix.features || 'headless' }} --target "${{ matrix.target }}"
      - name: Install qemu for the cross-arch smoke check
        # The aarch64-musl artifact cannot exec on the x86_64 runner; run it
        # under qemu-user so the smoke assertions still cover the real binary.
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: sudo apt-get install -y --no-install-recommends qemu-user-static
      - name: Smoke check (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          HRANESS_SUPPORT: "off"
        run: |
          set -euo pipefail
          cli="./target/${{ matrix.target }}/release/vhalla.exe"
          [[ "$("$cli" --help)" == *"Usage: vhalla <command>"* ]]
          help="$("$cli" help all)"
          printf '%s\n' "$help"
          [[ "$help" == *"vhalla identity "* ]]
          [[ "$help" == *"vhalla private "* ]]
          [[ "$("$cli" --version)" == *"features=[experimental-private]"* ]]
          dir="$RUNNER_TEMP/vhalla-smoke-identity"
          "$cli" identity init "$dir" > init.txt
          [[ "$("$cli" identity show "$dir")" == "$(cat init.txt)" ]]
          if "$cli" rooms > rooms.txt 2>&1; then
            cat rooms.txt
            exit 1
          fi
          [[ "$(cat rooms.txt)" == *"runs only on macOS and Linux"* ]]
      - name: Smoke check
        if: runner.os != 'Windows'
        shell: bash
        env:
          HRANESS_SUPPORT: "off"
        run: |
          set -euo pipefail
          cli="./target/${{ matrix.target }}/release/vhalla"
          # An empty unquoted prefix expands to nothing, so the native path is
          # unchanged; quoting it would pass an empty argv[0] and break exec.
          run_prefix=""
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            run_prefix="qemu-aarch64-static"
          fi
          # --help is the short grouped page; `help all` is the complete
          # command reference, so the feature checks read that.
          short_help="$($run_prefix "$cli" --help)"
          printf '%s\n' "$short_help"
          [[ "$short_help" == *"Usage: vhalla <command>"* ]]
          [[ "$short_help" == *"private-host "* ]]
          help="$($run_prefix "$cli" help all)"
          printf '%s\n' "$help"
          [[ "$help" == *"vhalla daemon "* ]]
          [[ "$help" != *"vhalla experimental "* ]]
          [[ "$help" != *"vhalla social "* ]]
          [[ "$help" != *"vhalla rooms "* ]]
          [[ "$help" != *"vhalla public "* ]]
          [[ "$help" == *"vhalla private "* ]]
          [[ "$help" == *"vhalla private-host "* ]]
          [[ "$help" == *"vhalla private-gateway "* ]]
          [[ "$help" != *"vhalla game replay "* ]]
          if $run_prefix "$cli" game --help > game-disabled.txt 2>&1; then
            cat game-disabled.txt
            exit 1
          fi
          [[ "$(cat game-disabled.txt)" == *'Unknown command "game"'* ]]
      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out="valhalla-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$out"
          cp "target/${{ matrix.target }}/release/vhalla" "$out/"
          tar -czf "${out}.tar.gz" "$out"
          shasum -a 256 "${out}.tar.gz" > "${out}.tar.gz.sha256"
      # The zip holds exactly one entry, vhalla.exe, which is what
      # site/install.ps1 admits.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out="valhalla-${GITHUB_REF_NAME}-${{ matrix.target }}"
          python -c "import sys, zipfile; z = zipfile.ZipFile(sys.argv[1], 'w', zipfile.ZIP_DEFLATED); z.write(sys.argv[2], 'vhalla.exe'); z.close()" "${out}.zip" "target/${{ matrix.target }}/release/vhalla.exe"
          # Git Bash's sha256sum marks Windows files binary (`HASH *NAME`);
          # every sidecar is `HASH  NAME`, which the publisher and both
          # installers check, so write that form explicitly.
          hash="$(python -c "import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest())" "${out}.zip")"
          printf '%s  %s\n' "$hash" "${out}.zip" > "${out}.zip.sha256"
          cat "${out}.zip.sha256"
      - name: Install the zip through site/install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/check_install_ps1.ps1 -Exe "target/${{ matrix.target }}/release/vhalla.exe" -Version $env:GITHUB_REF_NAME -Zip "valhalla-$($env:GITHUB_REF_NAME)-${{ matrix.target }}.zip"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ runner.os == 'Windows' && 'valhalla-*.zip' || 'valhalla-*.tar.gz' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: native
        with:
          name: release-cli-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            valhalla-*.tar.gz
            valhalla-*.tar.gz.sha256
            valhalla-*.zip
            valhalla-*.zip.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Preserve this target's immutable producer identity
        id: producer
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT_ID: ${{ steps.native.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.native.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            x86_64-unknown-linux-gnu) key=linux_gnu ;;
            x86_64-unknown-linux-musl) key=linux_musl ;;
            aarch64-unknown-linux-musl) key=linux_arm64 ;;
            x86_64-pc-windows-msvc) key=windows ;;
            *) exit 1 ;;
          esac
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 1
          printf '%s_artifact_id=%s\n%s_artifact_digest=%s\n' "$key" "$ARTIFACT_ID" "$key" "$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"


  macos_build:
    name: Build unsigned macOS executable without Apple credentials
    runs-on: macos-14
    timeout-minutes: 40
    outputs:
      artifact_id: ${{ steps.unsigned.outputs.artifact-id }}
      artifact_digest: ${{ steps.unsigned.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-aarch64-apple-darwin
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build vhalla
        env:
          VHALLA_BUILD_RELEASE_TAG: ${{ github.ref_name }}
        run: cargo build --release --locked -p vhalla-cli --no-default-features --features headless --target aarch64-apple-darwin
      - name: macOS host custody and lifecycle regressions
        # Tests inject launchctl replies and use temporary custody only. They
        # never install or activate a LaunchAgent or require a GUI login.
        run: |
          cargo test --release --locked -p vhalla-cli --no-default-features --features headless --target "aarch64-apple-darwin" --bin vhalla private_host::
      - name: macOS browser gateway socket regressions
        # macOS inherits listener descriptor flags on accepted sockets. Exercise
        # real server acceptance and complete large-asset writes on this platform.
        run: |
          cargo test --release --locked -p vhalla-private-native --features agent-rpc,relay-tls --target "aarch64-apple-darwin" --lib relay::http::tests::
      - name: Prepare bounded Mach-O signing input
        run: python3 -I .github/scripts/sign_macos_release.py prepare target/aarch64-apple-darwin/release/vhalla "$GITHUB_REF_NAME" "$RUNNER_TEMP/vhalla-unsigned"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: unsigned
        with:
          name: vhalla-unsigned-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vhalla-unsigned/*
          if-no-files-found: error
          retention-days: 14

  macos_sign:
    name: Sign and notarize without executing the payload
    needs: [validate, macos_build]
    environment: hraness-apple-release
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    outputs:
      artifact_id: ${{ steps.signed.outputs.artifact-id }}
      artifact_digest: ${{ steps.signed.outputs.artifact-digest }}
      archive_sha256: ${{ steps.identity.outputs.archive_sha256 }}
      checksum_sha256: ${{ steps.identity.outputs.checksum_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require the exact version tag at verified main source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin refs/heads/main
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin "refs/tags/$GITHUB_REF_NAME"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
      - name: Download exact same-run unsigned bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.macos_build.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.macos_build.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          python3 -I .github/scripts/release_artifacts.py fetch-zip vhalla-unsigned "$RUNNER_TEMP/unsigned.zip"
          python3 -I .github/scripts/sign_macos_release.py extract-artifact "$RUNNER_TEMP/unsigned.zip" "$ARTIFACT_DIGEST" "$GITHUB_REF_NAME" "$RUNNER_TEMP/unsigned-input"
      - name: Sign with Developer ID and require Apple Accepted
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: python3 -I .github/scripts/sign_macos_release.py sign "$RUNNER_TEMP/unsigned-input/valhalla-$GITHUB_REF_NAME-aarch64-apple-darwin.unsigned.tar.gz" "$GITHUB_REF_NAME" "$RUNNER_TEMP/signed-output" "$RUNNER_TEMP/vhalla-apple-signing"
      - name: Remove temporary credentials after failure or cancellation
        if: always()
        run: python3 -I .github/scripts/sign_macos_release.py cleanup "$RUNNER_TEMP/vhalla-apple-signing"
      - name: Record exact signed archive before any execution
        id: identity
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/signed-output/valhalla-$GITHUB_REF_NAME-aarch64-apple-darwin.tar.gz"
          printf 'archive_sha256=%s\n' "$(shasum -a 256 "$archive" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'checksum_sha256=%s\n' "$(shasum -a 256 "$archive.sha256" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ runner.temp }}/signed-output/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: signed
        with:
          name: release-cli-aarch64-apple-darwin-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-output/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve non-secret submission UUID and hashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vhalla-apple-notarization-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vhalla-apple-notarization.json
          if-no-files-found: ignore
          retention-days: 30

  macos_smoke:
    name: Verify and execute signed archive on a fresh runner
    needs: macos_sign
    runs-on: macos-14
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download and verify exact signed intermediate
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.macos_sign.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.macos_sign.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          python3 -I .github/scripts/release_artifacts.py fetch-zip release-cli-aarch64-apple-darwin "$RUNNER_TEMP/signed.zip"
          python3 -I .github/scripts/sign_macos_release.py extract-artifact "$RUNNER_TEMP/signed.zip" "$ARTIFACT_DIGEST" "$GITHUB_REF_NAME" "$RUNNER_TEMP/signed-input" --signed
          python3 -I .github/scripts/sign_macos_release.py extract-signed "$RUNNER_TEMP/signed-input/valhalla-$GITHUB_REF_NAME-aarch64-apple-darwin.tar.gz" "$GITHUB_REF_NAME" "$RUNNER_TEMP/vhalla"
      - name: Smoke check signed macOS release
        env:
          HRANESS_SUPPORT: "off"
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/vhalla"
          [[ "$("$cli" --help)" == *"Usage: vhalla <command>"* ]] || exit 1
          help="$("$cli" help all)"
          for command in daemon private private-host private-gateway; do
            [[ "$help" == *"vhalla $command "* ]] || exit 1
          done
          for command in experimental social rooms public; do
            [[ "$help" != *"vhalla $command "* ]] || exit 1
          done
          [[ "$help" != *"vhalla game replay "* ]] || exit 1
          if "$cli" game --help > "$RUNNER_TEMP/game-disabled.txt" 2>&1; then exit 1; fi
          [[ "$(cat "$RUNNER_TEMP/game-disabled.txt")" == *'Unknown command "game"'* ]] || exit 1

  publish:
    needs: [validate, cli, macos_sign, macos_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      checks: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download exact successful producer outputs for every target
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_GNU_ARTIFACT_ID: ${{ needs.cli.outputs.linux_gnu_artifact_id }}
          LINUX_GNU_ARTIFACT_DIGEST: ${{ needs.cli.outputs.linux_gnu_artifact_digest }}
          LINUX_MUSL_ARTIFACT_ID: ${{ needs.cli.outputs.linux_musl_artifact_id }}
          LINUX_MUSL_ARTIFACT_DIGEST: ${{ needs.cli.outputs.linux_musl_artifact_digest }}
          LINUX_ARM64_ARTIFACT_ID: ${{ needs.cli.outputs.linux_arm64_artifact_id }}
          LINUX_ARM64_ARTIFACT_DIGEST: ${{ needs.cli.outputs.linux_arm64_artifact_digest }}
          WINDOWS_ARTIFACT_ID: ${{ needs.cli.outputs.windows_artifact_id }}
          WINDOWS_ARTIFACT_DIGEST: ${{ needs.cli.outputs.windows_artifact_digest }}
          MACOS_ARTIFACT_ID: ${{ needs.macos_sign.outputs.artifact_id }}
          MACOS_ARTIFACT_DIGEST: ${{ needs.macos_sign.outputs.artifact_digest }}
        run: python3 -I .github/scripts/release_artifacts.py fetch-release release-assets
      # The page title is "Valhalla <tag>" and its notes are the tag's
      # CHANGELOG.md section plus generated install/verify text and identity.
      - name: Verify gates, stage draft, and publish complete release
        env:
          MACOS_ARCHIVE_SHA256: ${{ needs.macos_sign.outputs.archive_sha256 }}
          MACOS_CHECKSUM_SHA256: ${{ needs.macos_sign.outputs.checksum_sha256 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/publish_release.py release-assets
