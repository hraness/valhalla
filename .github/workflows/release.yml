name: Release

# Every tag reuses the complete Rust/site gate at that exact commit. Builders
# stage all artifacts; only the publisher can write a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/rust.yml

  cli:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build vhalla
        # Include the maintained public/private commands. The complete
        # all-features verification gate still runs above.
        run: cargo build --release --locked -p vhalla-cli --no-default-features --features experimental-network,experimental-sync,experimental-rooms-tui,experimental-public,experimental-private --target "${{ matrix.target }}"
      - name: macOS host custody and lifecycle regressions
        if: runner.os == 'macOS'
        # Tests inject launchctl replies and use temporary custody only. They
        # never install or activate a LaunchAgent or require a GUI login.
        run: |
          cargo test --release --locked -p vhalla-cli --no-default-features --features experimental-network,experimental-sync,experimental-rooms-tui,experimental-public,experimental-private --target "${{ matrix.target }}" --bin vhalla private_host::
      - name: macOS browser gateway socket regressions
        if: runner.os == 'macOS'
        # macOS inherits listener descriptor flags on accepted sockets. Exercise
        # real server acceptance and complete large-asset writes on this platform.
        run: |
          cargo test --release --locked -p vhalla-private-native --features agent-rpc,relay-tls --target "${{ matrix.target }}" --lib relay::http::tests::
      - name: Smoke check
        shell: bash
        env:
          HRANESS_SUPPORT: "off"
        run: |
          set -euo pipefail
          cli="./target/${{ matrix.target }}/release/vhalla"
          help="$("$cli" --help)"
          printf '%s\n' "$help"
          [[ "$help" == *"vhalla experimental "* ]]
          [[ "$help" == *"vhalla social "* ]]
          [[ "$help" == *"vhalla rooms "* ]]
          [[ "$help" == *"vhalla public "* ]]
          [[ "$help" == *"vhalla private "* ]]
          [[ "$help" == *"vhalla private-host "* ]]
          [[ "$help" == *"vhalla private-gateway "* ]]
          [[ "$help" != *"vhalla game replay "* ]]
          if "$cli" game --help > game-disabled.txt 2>&1; then
            cat game-disabled.txt
            exit 1
          fi
          [[ "$(cat game-disabled.txt)" == *"usage: vhalla identity"* ]]
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="valhalla-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$out"
          cp "target/${{ matrix.target }}/release/vhalla" "$out/"
          tar -czf "${out}.tar.gz" "$out"
          shasum -a 256 "${out}.tar.gz" > "${out}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-cli-${{ matrix.target }}
          path: |
            valhalla-*.tar.gz
            valhalla-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  menubar:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build vhalla-menubar
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml --target aarch64-apple-darwin
      - name: Smoke check
        # The GUI cannot run --help headless; verify its executable format.
        run: |
          set -euo pipefail
          bin=desktop/target/aarch64-apple-darwin/release/vhalla-menubar
          test -s "$bin"
          file "$bin" | grep -q "Mach-O 64-bit executable arm64"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="valhalla-menubar-${GITHUB_REF_NAME}-aarch64-apple-darwin"
          mkdir "$out"
          cp desktop/target/aarch64-apple-darwin/release/vhalla-menubar "$out/"
          tar -czf "${out}.tar.gz" "$out"
          shasum -a 256 "${out}.tar.gz" > "${out}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-menubar-aarch64-apple-darwin
          path: |
            valhalla-menubar-*.tar.gz
            valhalla-menubar-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: vhalla-browser
          path: valhalla-browser-${{ github.ref_name }}
      - name: Package the exact production artifact exercised by validation
        shell: bash
        env:
          QUALIFIED_MANIFEST_SHA256: ${{ needs.validate.outputs.browser_manifest_sha256 }}
        run: |
          set -euo pipefail
          out="valhalla-browser-${GITHUB_REF_NAME}"
          python3 .github/scripts/verify_browser_artifact.py "$out" --manifest-sha256 "$QUALIFIED_MANIFEST_SHA256"
          tar -czf "${out}.tar.gz" "$out"
          shasum -a 256 "${out}.tar.gz" > "${out}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-browser
          path: |
            valhalla-browser-*.tar.gz
            valhalla-browser-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, cli, menubar, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
      security-events: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify gates, stage draft, and publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/publish_release.py release-assets
